version: 3

policy:
  purpose: >
    Detect model-like construction, weak scene logic, and interchangeable
    dialogue while preserving the author's actual vocabulary, rhythm, humor,
    bluntness, dialect, and deliberate repetition.
  calibrate_against_corpus: true
  corpus_tolerance: 1.5
  min_corpus_words: 2000
  min_occurrences: 2
  lexical_bans: []
  word_level_enforcement: false
  auto_reject: false
  evidence_required: true
  priority_order:
    - character_voice_and_dialogue
    - scene_pressure_and_causality
    - structural_repetition
    - abstract_or_generic_emotion
    - isolated_word_choice

dialogue:
  principle: >
    A line must belong to a particular person in a particular pressure state.
    It should pursue, resist, hide, test, attack, repair, bargain, misdirect,
    reveal, or change something. Natural dialogue is not uniformly efficient,
    polite, articulate, or explanatory.
  required_checks:
    - id: speaker_separation
      check: >
        Build a voice map for every speaking character: syntax, sentence length,
        vocabulary, contractions, profanity, humor, directness, evasions,
        education or social register, recurring topics, and emotional restraint.
        Compare the map across characters, not against a generic ideal.
      failure: >
        Two characters can exchange lines without changing the scene's meaning,
        or every character shares the same polish, cadence, and emotional
        vocabulary.
      fix: >
        Change the character's tactic, omission, syntax, register, or specific
        knowledge. Do not give everyone a quirky catchphrase.
      severity: blocker

    - id: line_agenda
      check: >
        For sampled turns, identify what the speaker wants from the other person
        and what tactic the line uses: probe, dodge, lie, threat, concession,
        joke, bid, test, accusation, reassurance, or silence.
      failure: >
        A line only delivers information, confirms agreement, or restates what
        the reader already understands without changing pressure.
      fix: >
        Give the speaker a competing want or make the information arrive as a
        cost, evasion, misinterpretation, or choice.
      severity: major

    - id: subtext_and_misalignment
      check: >
        Compare what is said, what is meant, what the listener hears, and what
        remains unsaid. Conflict, intimacy, fear, status, and secrets should
        create misalignment when the scene's purpose calls for it.
      failure: >
        Characters state their exact feelings, theme, history, and desired
        outcome with no resistance or social risk.
      fix: >
        Let the line approach the subject sideways. Use a wrong answer,
        deflection, interruption, over-specific detail, joke, silence, or
        action that contradicts the words.
      severity: major

    - id: exposition_pressure
      check: >
        Test every explanatory exchange for shared knowledge, listener need,
        immediate stakes, and a reason this speaker chooses these words now.
      failure: >
        Characters explain their own world, relationship, or backstory for the
        reader while pretending the other character needs the briefing.
      fix: >
        Attach the information to a present objective, let the speaker conceal
        part of it, or move the information into conflict, memory, action, or
        consequence.
      severity: major

    - id: turn_and_consequence
      check: >
        Each exchange has a turn: new information, changed leverage, a failed
        bid, escalation, concession, interruption, decision, or exit.
      failure: >
        Dialogue alternates evenly without anyone being forced to adapt, or a
        scene can lose the conversation without changing afterward.
      fix: >
        Track pressure after each meaningful turn and end the exchange when the
        next action matters more than another line.
      severity: blocker

    - id: polished_convergence
      check: >
        Look for identical sentence completeness, emotional fluency, metaphor
        density, wit, politeness, and willingness to answer directly.
      failure: >
        Every character sounds articulate, self-aware, balanced, and helpful in
        the same way, including during anger, sex, grief, fear, or conflict.
      fix: >
        Preserve individual limits. One character may overtalk, another may
        answer with a question, another may choose plain facts, and another may
        weaponize precision.
      severity: blocker

    - id: dialogue_beats
      check: >
        Action beats and tags should reveal attention, physical state, choice,
        or power. Count repeated smiles, sighs, glances, jaw actions, breath
        actions, and other default placeholders across the scene.
      failure: >
        The same beat appears after every line or is used only to avoid a plain
        "said" or a real reaction.
      fix: >
        Cut the beat, use a neutral attribution, or choose an action that alters
        the conversation.
      severity: major

    - id: question_answer_shape
      check: >
        Questions may be answered, evaded, misunderstood, countered, ignored,
        or punished according to the relationship and pressure.
      failure: >
        Every question receives a clean answer, making the exchange feel like a
        form or an interview.
      fix: >
        Let the answer reveal the speaker's priority rather than merely satisfy
        the grammatical question.
      severity: major

    - id: romantic_and_intimate_subtext
      check: >
        Attraction, consent, fear, power, and vulnerability should appear in
        choices, boundaries, timing, and what characters risk saying, not only
        in declarations.
      failure: >
        Intimacy is announced in generic language or characters speak with
        identical confidence and emotional vocabulary.
      fix: >
        Preserve the approved boundary and make the exchange specific to these
        bodies, histories, wants, and limits.
      severity: major

  dialogue_metrics:
    compare_to_author_corpus: true
    report_character_line_length_spread: true
    report_speaker_turn_length_spread: true
    report_question_answer_mismatch: true
    report_dialogue_to_action_ratio: true
    report_tag_and_beat_repetition: true
    report_repeated_templates: true
    minimum_voice_samples_per_character: 3

structural_tells:
  - id: negation_pivot
    pattern: '"Not X, but Y" or "It was not X. It was Y."'
    why: A repeated contrast template can create synthetic profundity without a scene-specific observation.
    fix: State the concrete observation or let the character's interpretation be incomplete.
    severity_when_repeated: major

  - id: abstract_resolution
    pattern: An abstraction resolves a scene's main beat.
    why: The turn is asserted instead of enacted through choice, behavior, dialogue, or consequence.
    fix: Put the change on the page in a specific action or altered relationship.
    severity_when_repeated: blocker

  - id: uniform_cadence
    pattern: Consecutive sentences or paragraphs share near-identical shape and length.
    why: Machine-like uniformity ignores tension and character attention.
    fix: Vary structure in response to pressure; use the corpus target, not a generic rhythm ideal.
    severity_when_repeated: blocker

  - id: summary_ending
    pattern: A closing paragraph explains what the chapter meant after the turn already happened.
    why: It removes reader participation and weakens the handoff.
    fix: End on the changed pressure, action, image, or spoken choice.
    severity_when_repeated: blocker

  - id: unsupported_emotion_label
    pattern: A feeling is named without behavior, thought, sensory detail, dialogue, or choice that earns it.
    why: The prose reports an emotion instead of letting the reader infer it.
    fix: Add evidence or cut the label. Keep the label when the author's corpus uses it deliberately.
    severity_when_repeated: major

  - id: filter_stack
    pattern: Perception filters stack between POV and concrete detail.
    why: Repeated filtering can create distance the approved POV does not want.
    fix: Measure against the author's distance profile and cut only excess filters.
    severity_when_repeated: minor

  - id: decorative_image
    pattern: A metaphor does not reveal character, sharpen atmosphere, advance plot, or fit POV knowledge.
    why: Ornament substitutes for scene-specific perception.
    fix: Source the image from the viewpoint character or remove it.
    severity_when_repeated: major

  - id: hedged_consequence
    pattern: Repeated hedges weaken concrete actions or choices.
    why: The prose avoids committing to what happened.
    fix: Keep uncertainty where the character genuinely lacks knowledge; otherwise state the event.
    severity_when_repeated: minor

advisory_patterns:
  - id: default_body_reaction
    examples: [breath, heart, throat, stomach, jaw, shoulders, swallowed]
    use: Inspect only when clustered, repeated by different characters, or substituting for a specific response.
  - id: container_emotion
    examples: [wave, surge, pang, flicker, rush, spark]
    use: Inspect only when abstract containers carry the whole emotional turn.
  - id: significance_time
    examples: ["for a long moment", "in that moment", "time slowed"]
    use: Inspect only when repeated or used instead of a concrete pause or action.
  - id: essay_register
    examples: [however, moreover, nevertheless, "it was clear"]
    use: Inspect against POV and corpus register; never reject by frequency alone.
  - id: explanatory_dialogue
    examples: ["as you know", "let me explain", "this changes everything"]
    use: Inspect the scene function, speaker agenda, and listener knowledge before judging.

never_flag:
  - Any individual word solely because it appears in a list.
  - Dialogue tags or ordinary vocabulary that the author's corpus uses naturally.
  - Fragments, repetition, profanity, bluntness, dialect, stilted speech, or plain prose when supported by character or corpus evidence.
  - Genre conventions, motifs, deliberate refrains, or repeated phrases declared by the chapter plan.
  - A construction from another author's reference book as a style target.

rewrite_principles:
  - Diagnose the scene function before changing a line.
  - Cut a weak construction before reaching for a thesaurus synonym.
  - Give each speaker a want, tactic, limit, and consequence.
  - Prefer specific behavior, choice, sensory detail, and subtext over explanation.
  - Keep the author's measured rhythm and unusual habits when they are intentional.
  - Never make dialogue more polished, therapeutic, witty, or literary than the character and corpus support.

audit_output:
  required_fields:
    - location
    - speaker_or_pov
    - exact_text
    - issue_id
    - scene_function
    - severity
    - corpus_or_plan_evidence
    - repair_direction
  statuses: [pass, fail, not_checked, preserve]
