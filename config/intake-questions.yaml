initial:
  - id: project_shape
    question: Is this a standalone, a series, or unknown?
    options: [standalone, series, novella, short_story, unknown]
  - id: audience
    question: Who is the target audience?
    options: [adult, new_adult, young_adult, middle_grade, children, unknown]
  - id: drafting_mode
    question: How should Canon Quill draft after preparation approval?
    options: [chapter_by_chapter, book_by_book]
  - id: spice_boundary
    question: What intimacy level is allowed?
    options: [none, romantic, fade_to_black, open_door, explicit, very_explicit]
  - id: mystery_policy
    question: How should mysteries and ambiguity be handled?
    options: [leave_open, imply, reveal_later, explain_fully]
