async function loadBrowse(folderId) {
  browse.loading = true; render();
  try {
    const r = await api(`/api/drive/browse?folderId=${encodeURIComponent(folderId)}`);
    browse.entries = r.entries; browse.folderId = folderId;
    browse.emptyBecauseScope = r.emptyBecauseScope; browse.canBrowse = r.canBrowse;
  } catch (e) { toast(e.message, "error"); browse.entries = []; }
  browse.loading = false; render();
}
function openFolder(id, name) { browse.crumbs.push({ id, name }); loadBrowse(id); }
function jump(i) { browse.crumbs = browse.crumbs.slice(0, i + 1); loadBrowse(browse.crumbs[i].id); }
function saveSourceSelections() {
  const body = {
    roots: [...picked.keys()],
    referenceNames: Object.fromEntries(picked),
    targetFolderId: target?.id || "",
    targetFolderName: target?.name || ""
  };
  selectionSave = selectionSave.then(async () => {
    S = await api("/api/drive/roots", { method: "POST", body });
  }).catch((e) => toast(`Could not save source selections: ${e.message}`, "error"));
  return selectionSave;
}
function toggleRef(id, name) { sourceAnalysisStarted = false; picked.has(id) ? picked.delete(id) : picked.set(id, name); render(); saveSourceSelections(); }
function unpick(id) { sourceAnalysisStarted = false; picked.delete(id); render(); saveSourceSelections(); }
function pickTarget(id, name) { sourceAnalysisStarted = false; target = target?.id === id ? null : { id, name }; render(); saveSourceSelections(); }
function clearTarget() { sourceAnalysisStarted = false; target = null; render(); saveSourceSelections(); }

/**
 * Analysing replaces the whole grouping, so an existing one is worth a warning:
 * any corrections made by hand on the board are lost.
 */
function analyseSources(btn) {
  const existing = (S.sources || []).length;
  if (!existing) return runAnalysis(btn);

  const touched = S.sources.filter((x) => (x.kinds || []).length).length;
  showModal({
    title: "Replace the current analysis?",
    body: `<p class="hint" style="margin:0 0 10px">This book already has
      <b>${plural(existing, "document")}</b> indexed${touched ? `, ${touched} of them grouped` : ""}.</p>
      <p class="hint" style="margin:0">Analysing again reads your Drive from scratch and replaces the
      grouping entirely. Any groups you set by hand are lost. Chapters, continuity and the style corpus
      are not affected.</p>`,
    actions: `<button onclick="closeModal();runAnalysis()">Replace analysis</button>
      <button class="ghost" onclick="closeModal()">Keep what I have</button>`
  });
}

async function runAnalysis(btn) {
  if (btn) btn.disabled = true;
  indexError = null;
  indexing = true;
  sourceAnalysisStarted = true;
  render();
  await new Promise((resolve) => requestAnimationFrame(resolve));
  route = "analyze";
  render();
  try {
    if (!S.drive.connected && (S.sources || []).some((source) => source.driveId.startsWith("local-"))) {
      S = await api("/api/sources/reviewed", { method: "POST" });
      indexing = false;
      route = "analyze";
      await loadCheck();
      toast("Uploaded files are ready to review.");
      render();
      return;
    }
    await saveSourceSelections();
    S = await api("/api/sources/index", { method: "POST" });
    indexing = false;
    await loadCheck();
    toast(`Indexed ${plural(S.sources.length, "document")} from your Drive.`);
  } catch (e) {
    indexing = false;
    indexError = e.message;
    sourceAnalysisStarted = false;
    route = "sources";
    toast(e.message, "error");
  }
  render();
}

async function reviewUploadedSources(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/sources/reviewed", { method: "POST" });
    route = "analyze";
    await loadCheck();
    render();
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

function viewAnalyze() {
  if (indexing) return `
    <h1>Analyse and group</h1>
    <div class="card" style="text-align:center;padding:44px 20px">
      <div style="margin-bottom:16px;line-height:0"><span class="spin spin-lg"></span></div>
      <b>Reading your Drive</b>
      <p class="sub" style="margin:8px auto 0;max-width:46ch">Walking each folder, downloading every
      document and sorting it into groups. A large folder can take a few minutes. You can leave this
      page open.</p>
    </div>`;

  if (indexError) return `
    <h1>Analyse and group</h1>
    <div class="info warn">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
      <div><b>Indexing failed</b><p>${esc(indexError)}</p></div></div>
    <button onclick="go('sources')">Back to sources</button>`;

  if (!S.sources.length) return `<h1>Analyse and group</h1>
    <p class="sub">Nothing indexed yet.</p><button onclick="go('sources')">Select sources</button>`;

  const counts = Object.fromEntries(Object.keys(KINDS).map((k) =>
    [k, S.sources.filter((x) => (x.kinds || []).includes(k)).length]));

  // Alphabetical: Drive's own order is arbitrary and a long board is unusable
  // without somewhere predictable to look.
  const sorted = [...S.sources].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  const docs = sorted.map((src) => {
    const ungrouped = !(src.kinds || []).length;
    return `
    <div class="doc ${ungrouped ? "ignored" : ""}">
      <div class="doc-h">
          <div><b>${esc(src.name)}</b>
          <div class="doc-m">${esc(src.path || "")}${src.wordCount ? ` · ${plural(src.wordCount, "word", null, src.wordCount.toLocaleString())}` : ""}${src.classification ? ` · ${Math.round(src.classification.confidence * 100)}% confidence` : ""}</div>
        </div>
        <button class="doc-x" title="Remove from this analysis" onclick="removeSource('${src.driveId}')">✕</button>
      </div>
      ${src.classification?.reasons?.length ? `<div class="hint" style="margin-top:7px">Why: ${esc(src.classification.reasons.join("; "))}
        ${src.classification.alternative ? ` · alternative: ${esc(KINDS[src.classification.alternative] || src.classification.alternative)}` : ""}</div>` : ""}
      <div class="chips">
        ${Object.entries(KINDS).map(([k, label]) => {
          const on = (src.kinds || []).includes(k);
          return `<button class="chip ${on ? "on" : ""}" title="${esc(KIND_PURPOSE[k] || "")}"
            onclick="toggleKind('${src.driveId}','${k}')">${esc(label)}</button>`;
        }).join("")}
      </div>
      ${ungrouped ? `<div class="doc-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
          style="width:12px;height:12px;flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
        No group, so this document will be ignored. Pick a label, or remove it.</div>` : ""}
    </div>`;
  }).join("");

  const unassigned = S.sources.filter((x) => !(x.kinds || []).length).length;

  return `
  <h1>Analyse and group</h1>
  <p class="sub">Every document was read and sorted. Correct anything in the wrong place by clicking the
  labels. A document can belong to several groups at once, which is common: one file often holds a
  timeline, an outline and loose notes.</p>

  ${check ? `<div class="reqs">
    ${[["Voice reference (required)", check.style, "at least 2,000 words of prose"],
        ["Plot & outline (required)", check.plot, "at least one plot or outline"]].map(([title, r, purpose]) => `
      <div class="req ${r.ok ? "ok" : "todo"}">
        <div class="req-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
            style="width:14px;height:14px;flex:none">
            ${r.ok ? '<path d="M20 6L9 17l-5-5"/>' : '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>'}
          </svg>
          <b>${title}</b>
          <span class="req-n">${r.documents ? `${plural(r.documents, "document")} · ${r.words.toLocaleString()} words` : "none yet"}</span>
        </div>
         <p>${r.ok ? `Enough: ${purpose}.` : esc(r.reason)}</p>
      </div>`).join("")}
  </div>` : ""}

  <div class="counts">${Object.entries(KINDS).map(([k, label]) => {
    const n = counts[k];
    const forms = KIND_COUNTS[k];
    const name = forms ? (n === 1 ? forms.one : forms.many) : label;
    return `<div class="count ${n ? "" : "zero"}"><b>${n}</b><span>${esc(name)}</span></div>`;
  }).join("")}</div>

  <h2>${plural(S.sources.length, "document")}</h2>
  ${unassigned ? `<div class="hint" style="margin-bottom:8px;color:var(--warn)">${plural(unassigned, "document")} ${verb(unassigned, "has", "have")} no group, highlighted below.</div>` : ""}
  ${docs}

  <div class="row" style="margin-top:18px">
    <button ${check && !check.ok ? "disabled" : ""} onclick="finishReview(this)">Continue</button>
    <button class="ghost" onclick="go('sources')">Back to sources</button>
  </div>`;
}

let check = null;

async function loadCheck() {
  try { check = await api("/api/sources/check"); if (route === "analyze") render(); }
  catch { /* advisory */ }
}

async function toggleKind(driveId, kind) {
  const src = S.sources.find((x) => x.driveId === driveId);
  if (!src) return;
  if (kind === "reference_book" && (src.kinds || []).includes("past_book")) {
    showModal({
      title: "Series books are voice references too",
      body: `<p><b>${esc(src.name)}</b> is marked as a Series book, so it is automatically used as a voice reference.</p>
        <p class="hint">Choose whether to remove both labels or keep both. To remove only Series book, close this message and click the Series book label directly.</p>`,
      actions: `<button onclick="removeBothSourceRoles('${driveId}')">Remove both</button>
        <button class="ghost" onclick="closeModal()">Keep both</button>`
    });
    return;
  }
  const kinds = new Set(src.kinds || []);
  kinds.has(kind) ? kinds.delete(kind) : kinds.add(kind);
  src.kinds = [...kinds];          // optimistic: the board stays responsive
  render();
  try {
    S = await api(`/api/sources/${driveId}`, { method: "PATCH", body: { kinds: src.kinds } });
    await loadCheck();
  } catch (e) { toast(e.message, "error"); await reload(); }
}

async function removeBothSourceRoles(driveId) {
  const src = S.sources.find((x) => x.driveId === driveId);
  if (!src) return;
  closeModal();
  try {
    S = await api(`/api/sources/${driveId}`, {
      method: "PATCH",
      body: { kinds: (src.kinds || []).filter((kind) => kind !== "past_book" && kind !== "reference_book") }
    });
    await loadCheck();
    render();
  } catch (e) { toast(e.message, "error"); }
}

async function removeSource(driveId) {
  const src = S.sources.find((x) => x.driveId === driveId);
  if (!src) return;
  showModal({
    title: "Remove from this analysis?",
    body: `<p class="hint" style="margin:0"><b>${esc(src.name)}</b> will be dropped from the board and
      not read again until you analyse your sources afresh. Nothing in your Drive is changed.</p>`,
    actions: `<button onclick="confirmRemoveSource('${driveId}')">Remove</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>`
  });
}

async function confirmRemoveSource(driveId) {
  closeModal();
  const name = S.sources.find((x) => x.driveId === driveId)?.name ?? "Document";
  try {
    S = await api(`/api/sources/${driveId}`, { method: "DELETE" });
    await loadCheck(); render();
    toast(`Removed "${name}" from the analysis.`);
  } catch (e) { toast(e.message, "error"); }
}

async function finishReview(btn) {
  btn.disabled = true;
  try { S = await api("/api/sources/reviewed", { method: "POST" }); go("intake"); }
  catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

const AUDIENCES = ["Adult", "New adult", "Young adult", "Middle grade", "Children"];
const INTIMACY = ["None", "Romantic tension only", "Fade to black", "Open door", "Explicit", "Very explicit"];

function orderedSeriesBooks() {
  const books = (S.sources || []).filter((source) => (source.kinds || []).includes("past_book"));
  const byId = new Map(books.map((book) => [book.driveId, book]));
  const order = [...(S.seriesOrder || []), ...books.map((book) => book.driveId)];
  return [...new Set(order)].map((id) => byId.get(id)).filter(Boolean);
}

function seriesOrderSection() {
  if (S.shape !== "series") return "";
  const books = orderedSeriesBooks();
  if (!books.length) return `<div class="info" style="margin-top:18px">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
    <div><b>No earlier series books selected</b><p>Go back to Analyse &amp; group and mark the books whose canon this book inherits as <b>Series book</b>. A current draft or voice sample should remain a Voice reference instead.</p></div></div>`;

  return `<div class="card" style="margin-top:18px">
    <h2 style="margin-top:0">Order the series books</h2>
    <p class="sub">Put the books in continuity order, earliest to latest. Canon Quill uses this order for prior events, character knowledge and unresolved threads. It uses the titles you give the documents, not assumed Book 1, Book 2 or Book 3 numbers.</p>
    <div class="series-order">
      ${books.map((book, index) => `<div class="item" draggable="true"
        ondragstart="seriesDragId='${book.driveId}'"
        ondragover="event.preventDefault()"
        ondrop="dropSeriesBook('${book.driveId}')"
        ondragend="seriesDragId=null">
        <span class="drag-handle" title="Drag to reorder">::</span>
        <span class="pill">${index + 1}</span>
        <span class="name">${esc(book.name)}</span>
        <button class="ghost sm" onclick="event.stopPropagation();moveSeriesBook('${book.driveId}',-1)" ${index === 0 ? "disabled" : ""}>↑</button>
        <button class="ghost sm" onclick="event.stopPropagation();moveSeriesBook('${book.driveId}',1)" ${index === books.length - 1 ? "disabled" : ""}>↓</button>
      </div>`).join("")}
    </div>
    <div class="hint" style="margin-top:10px">If the current book is already started, leave it as a Voice reference and remove its Series book label on the Analyse screen. It should not become prior canon.</div>
  </div>`;
}

async function saveSeriesOrder(order, confirmed = false) {
  try {
    S = await api("/api/project/series-order", { method: "PATCH", body: { order, confirmed } });
    render();
  } catch (e) { toast(e.message, "error"); }
}

function dropSeriesBook(targetId) {
  if (!seriesDragId || seriesDragId === targetId) return;
  const order = orderedSeriesBooks().map((book) => book.driveId);
  const from = order.indexOf(seriesDragId);
  const to = order.indexOf(targetId);
  if (from < 0 || to < 0) return;
  order.splice(from, 1);
  order.splice(to, 0, seriesDragId);
  seriesDragId = null;
  void saveSeriesOrder(order);
}

function moveSeriesBook(id, direction) {
  const order = orderedSeriesBooks().map((book) => book.driveId);
  const from = order.indexOf(id);
  const to = from + direction;
  if (from < 0 || to < 0 || to >= order.length) return;
  [order[from], order[to]] = [order[to], order[from]];
  void saveSeriesOrder(order);
}

async function loadSuggestions() {
  try {
    const r = await api("/api/intake/suggestions");
    const suggestions = r.suggestions || {};
    const current = S.intake || {};
    const automatic = Object.entries(suggestions)
      .filter(([key, suggestion]) => !current[key] && (suggestion.confidence || 0) >= autoApplyThreshold(key))
      .reduce((values, [key, suggestion]) => ({ ...values, [key]: normalizeSuggestion(key, suggestion.value) }), {});
    if (Object.keys(automatic).length > 0) {
      S = await api("/api/project", {
        method: "PATCH",
        body: { intake: automatic, ...(automatic.shape ? { shape: automatic.shape } : {}) }
      });
    }
    if (route === "intake") render();
  } catch { /* Prefills do not block the project-shape screen. */ }
}

function autoApplyThreshold(key) {
  if (key === "audience" || key === "spice") return 0.25;
  return key === "pov" || key === "tense" ? 0.5 : 0.8;
}

function normalizeSuggestion(key, value) {
  if (key === "audience") {
    return [...new Set(String(value).split("|").map((item) => AUDIENCES.find((option) => option.toLowerCase() === item.trim().toLowerCase()) || item.trim()).filter(Boolean))].join("|");
  }
  if (key === "spice") return INTIMACY.find((option) => option.toLowerCase() === String(value).trim().toLowerCase()) || value;
  return value;
}

/** Multi-value fields are stored pipe-joined so the state stays flat strings. */
async function toggleMulti(field, value) {
  const current = ((S.intake || {})[field] || "").split("|").filter(Boolean);
  const next = current.includes(value) ? current.filter((v) => v !== value) : [...current, value];
  await setProject({ intake: { [field]: next.join("|") } });
}

async function setProject(patch) {
  try { S = await api("/api/project", { method: "PATCH", body: patch }); render(); }
  catch (e) { toast(e.message, "error"); }
}

async function continueProjectShape(btn) {
  btn.disabled = true;
  try {

    S = await api("/api/project/continue", { method: "POST" });

function confirmDraftSelection(driveId, name) {
  showModal({
    title: "Use this existing draft?",
    body: `<p>This will read <b>${esc(name)}</b> and replace the current existing-draft selection if one is already chosen.</p>
      <p class="hint">Canon Quill will analyse its continuation point, ending, epilogue, closing material, and formatting before you continue.</p>`,
    actions: `<button id="use-draft-btn" onclick="useAsDraft('${driveId}', '${esc(name).replace(/'/g, "\\'")}', this)">Use this draft</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>`
  });
}

async function useAsDraft(driveId, name, btn) {
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Reading…';
  try {
    closeModal();
    draftPicker = false;
    draftAnalysisLoading = true;
    render();
    const r = await api("/api/manuscript/analyse", { method: "POST", body: { driveId } });
    S = r.state;
    toast(`Read ${plural(r.analysis.totalWords, "word", null, r.analysis.totalWords.toLocaleString())} from "${name}".`);
  } catch (e) {
    toast(e.message, "error");
    draftPicker = true;
  } finally {
    draftAnalysisLoading = false;
    render();
  }
}

async function skipDraft(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/manuscript/skip", { method: "POST" });
    route = "style";
    render();
    toast("Starting from the first line.");

/** Voice references that contain prose, excluding planning-only documents. */
function isVoiceReferenceSource(source) {
  const kinds = source.kinds || [];
  if (!kinds.includes("reference_book")) return false;
  return kinds.includes("past_book") || (source.voiceReferenceConfirmed === true
    && !kinds.some((kind) => ["characters", "timeline", "world", "plot", "notes"].includes(kind)));
}

function stylePool() {
  return S.sources.filter(isVoiceReferenceSource);
}

function viewStyle() {
  const sc = S.styleCorpus;
  const excluded = sc.excluded || [];
  const books = S.sources.filter((s) => (s.kinds || []).includes("past_book"));
  const refs = S.sources.filter((s) => (s.kinds || []).includes("reference_book"));
  const usingReference = books.length === 0 && stylePool().length > 0;
  const pool = stylePool();
  const included = pool.filter((d) => !excluded.includes(d.driveId));
  const left = pool.filter((d) => excluded.includes(d.driveId));
  const notMeasured = refs.filter((source) => !isVoiceReferenceSource(source));
  const canBuild = S.sourcesReviewed && included.length > 0;
  return `
  <h1>Style corpus</h1>
  <p class="sub">This is what stops the writing sounding generic. ${usingReference
    ? "No series books are marked, so Canon Quill is using the selected reference prose as a fallback voice source."
    : "Canon Quill cuts the selected Voice references into passages and measures your prose."} When a chapter
  is drafted, ${usingReference ? "passages from that source" : "real passages of yours"} for that same beat go into the prompt, and the result is
  scored against your measured fingerprint, not against a generic idea of good writing.</p>

  <div class="card spread">
    <div><b>${refs.length
        ? plural(refs.length, "voice reference")
        : "No voice references selected"}</b>
      <div class="hint">${included.length
        ? `${plural(included.length, "prose source")} measured for voice: ${included.map((b) => esc(b.name)).join(", ")}`
        : "Mark prose as Voice reference on the Analyse screen."}</div>
      ${notMeasured.length ? `<div class="hint" style="margin-top:4px">Not measured as prose: ${notMeasured.map((source) => esc(source.name)).join(", " )}. These remain available for canon and preparation.</div>` : ""}
      ${left.length ? `<div class="hint" style="margin-top:4px">Left out: ${left.map((b) => esc(b.name)).join(", ")}.</div>` : ""}
      ${usingReference ? '<div class="hint" style="color:var(--warn);margin-top:4px">No Series book is marked, so this uses the selected Voice references for the initial voice model.</div>' : ""}</div>
    <button ${pool.length ? "" : "disabled"} onclick="styleBuildModal()">${sc.built ? "Rebuild style corpus" : "Build style corpus"}</button>
  </div>

  ${sc.built ? `<div class="card">
    <div class="row" style="justify-content:flex-end;margin-bottom:10px">
      <span class="pill good">${plural(sc.passageCount, "passage")}</span>
      <span class="pill">${plural(sc.wordCount, "word", null, sc.wordCount.toLocaleString())}</span></div>
    ${sc.wordCount < 2000 ? '<div class="hint" style="color:var(--warn)">Under 2,000 words, so the fingerprint will be noisy. Add more of your prose.</div>' : ""}
    ${sc.notes ? `<div class="info" style="margin:0 0 12px">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M4 5h16M4 10h16M4 15h10"/></svg>
      <div><b>Your notes on this voice</b><p style="white-space:pre-wrap">${esc(sc.notes)}</p>
         <p style="margin-top:6px">The drafting and editing agents read these with the fingerprint, and follow them where a measured target disagrees.</p></div></div>` : ""}
    ${sc.documentStats?.length ? `<div style="margin:14px 0 0"><h3 style="margin:0 0 8px">Corpus sources</h3>
      <table><tr><th>Source</th><th class="num">Words</th><th class="num">Chapters</th><th class="num">Min / chapter</th><th class="num">Max / chapter</th><th class="num">Avg / chapter</th></tr>
      ${sc.documentStats.map((doc) => { const stats = chapterStats(doc.wordsPerChapter); return `<tr><td>${esc(doc.source)}</td><td class="num">${doc.wordCount.toLocaleString()}</td><td class="num">${doc.chapterCount}</td><td class="num">${stats ? stats.min.toLocaleString() : "N/A"}</td><td class="num">${stats ? stats.max.toLocaleString() : "N/A"}</td><td class="num">${stats ? stats.average.toLocaleString() : "N/A"}</td></tr>`; }).join("")}</table>
    </div>` : ""}
    ${sc.fromReference && !sc.documentStats?.length ? '<div class="hint" style="margin-top:14px">This corpus is learned from reference material rather than series books, so chapter-by-chapter book metrics are not shown.</div>' : ""}
    <div id="fp" style="margin-top:24px"><span class="spin"></span></div>
    <div class="row" style="margin-top:16px">
      <button onclick="continueFromStyle(this)">Continue</button>
    </div>
    </div>` : ""}
  ${!canBuild && pool.length ? '<div class="hint" style="color:var(--warn);margin-top:8px">Review the source grouping, and keep at least one document in the corpus.</div>' : ""}
  ${!pool.length ? '<div class="hint" style="color:var(--warn);margin-top:8px">Review the source grouping and mark prose as Voice reference before building the corpus.</div>' : ""}`;
}

let styleKeep = null;

function styleBuildModal() {
  const sc = S.styleCorpus;
  const pool = stylePool();

  const excluded = sc.excluded || [];
  styleKeep = new Set(pool.filter((d) => !excluded.includes(d.driveId)).map((d) => d.driveId));
  showModal({
    title: sc.built ? "Rebuild the style corpus" : "Build the style corpus",
    body: `<p class="hint" style="margin:0 0 12px">Everything here stays on this machine. Measuring the
      prose is deterministic, so a rebuild over the same documents gives the same fingerprint.</p>
       <label>Learn my voice from ${plural(pool.length, "prose source")}</label>
       <div class="chips" id="stylepick" style="margin-top:0">
         ${pool.map((d) => `<button class="chip ${styleKeep.has(d.driveId) ? "on" : ""}"
           onclick="toggleStyleDoc(this,'${d.driveId}')">${esc(d.name)}</button>`).join("")}</div>
       ${notMeasured.length ? `<div class="hint" style="margin-top:8px">${plural(notMeasured.length, "Voice reference")} not included because ${notMeasured.length === 1 ? "it is" : "they are"} not prose: ${notMeasured.map((source) => esc(source.name)).join(", ")}. ${notMeasured.length === 1 ? "It remains available" : "They remain available"} for canon and preparation.</div>` : ""}
       <div class="hint">Drop anything that is not the voice you want to carry forward: a comparison title,
       a co-authored book, or a draft you would not want copied.</div>
      <label style="margin-top:16px">Notes for the writing agents</label>
      <textarea id="stylenotes" rows="4" placeholder="Book two was heavily edited, so trust book three. My dialogue runs shorter than the average suggests.">${esc(sc.notes || "")}</textarea>
      <div class="hint">Optional. These go into the fingerprint document the drafting and editing
      agents read, and they outrank a measured target when the two disagree.</div>`,
    actions: `<button id="stylebuildbtn" onclick="buildStyle(this)">${sc.built ? "Rebuild corpus" : "Build corpus"}</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>`
  });
}

function toggleStyleDoc(btn, id) {
  if (styleKeep.has(id)) styleKeep.delete(id); else styleKeep.add(id);
  btn.classList.toggle("on", styleKeep.has(id));
  document.getElementById("stylebuildbtn").disabled = styleKeep.size === 0;
}

async function buildStyle(btn) {
  const pool = stylePool();
  const body = {};
  const notes = document.getElementById("stylenotes");
  if (notes) {
    body.notes = notes.value;
    body.excluded = pool.filter((d) => !styleKeep.has(d.driveId)).map((d) => d.driveId);
  }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Building…';
  try {
    S = await api("/api/style/build", { method: "POST", body });
    FINGERPRINT = null;
    closeModal();
    toast("Style corpus built."); render(); loadFingerprint();
  }
  catch (e) { toast(e.message, "error"); closeModal(); render(); }
}

async function continueFromStyle(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/style/continue", { method: "POST" });
    route = "intake_analysis";
    render();
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false;
  }
}

const FINDING_ROWS = [
  ["premise", "Story promise"],
  ["protagonist", "Protagonist"],
  ["cast", "Main cast"],
  ["relationships", "Relationship arc"],
  ["centralConflict", "Conflict and stakes"],
  ["setting", "Setting"],
  ["timeline", "Timeline"],
  ["structure", "Structure / ending"],
  ["prologue", "Prologue"],
  ["epilogue", "Epilogue"],
  ["narration", "Narration"],
  ["audience", "Audience"],
  ["intimacy", "Intimacy signal"]
];

let analysisEditing = false;

function correctionCount(analysis) {
  const edits = analysis.edits || {};
  return Object.keys(edits.findings || {}).length
    + (edits.genre !== undefined ? 1 : 0)
    + (edits.subgenre !== undefined ? 1 : 0);
}

function viewIntakeAnalysis() {
  const analysis = S.projectAnalysis || {};
  const complete = analysis.completed;
  const findings = analysis.findings || {};
  const corrections = correctionCount(analysis);
  const editing = analysisEditing && complete;

  const row = ([key, label]) => {
    const finding = findings[key];
    if (editing) {
      return `<tr><td><b>${esc(label)}</b></td><td>
        <textarea class="analysis-finding" data-finding="${key}" data-orig="${esc(finding?.value || "")}" rows="3"
          placeholder="Not established. Type what is true, or leave it empty.">${esc(finding?.value || "")}</textarea></td></tr>`;
    }
    if (!finding) {
      if (key === "prologue" || key === "epilogue") return `<tr><td><b>${esc(label)}</b></td><td>N/A</td><td class="hint">N/A</td></tr>`;
      return `<tr><td><b>${esc(label)}</b></td><td colspan="2" style="color:var(--warn)">Not established in the selected material</td></tr>`;
    }
    return `<tr><td><b>${esc(label)}</b></td><td>${esc(finding.value)}
      ${finding.authorEdited ? '<span class="pill good" style="margin-left:6px">Yours</span>' : ""}</td>
      <td class="hint">${esc((finding.evidence || []).join(" "))}</td></tr>`;
  };

  return `<h1>Project analysis</h1>
    <p class="sub">The analyzer reads every selected document before the agent asks anything. It separates source-supported facts from author decisions, so the intake conversation is about this book rather than a generic form. It measures text, so it can read something wrong: correct anything below and your version is what the agents work from.</p>
    <div class="card">
      ${projectAnalysisLoading
        ? `<div style="text-align:center;padding:28px 12px"><span class="spin spin-lg"></span><h3 style="margin:14px 0 6px">Analyzing your project material</h3><p class="sub" style="margin:0 auto;max-width:48ch">Reading the cached references, plot material, character notes, and existing style signals. This is deterministic and stays on your machine.</p></div>`
        : !complete
          ? `<div style="text-align:center;padding:28px 12px"><h3 style="margin:0 0 8px">Ready to analyse</h3><p class="sub" style="margin:0 auto 16px;max-width:48ch">Nothing has been read for Project analysis yet. Start it when you are ready to review the evidence and correct the findings.</p><button onclick="startProjectAnalysis(this)">Analyse project</button></div>`
        : `<div class="row spread" style="margin-bottom:10px">
             <div class="row"><b>Analysis complete</b><span class="pill good">${plural(analysis.documentsRead || 0, "document")} read</span><span class="pill">${plural(analysis.wordsRead || 0, "word", null, (analysis.wordsRead || 0).toLocaleString())}</span>
               ${corrections ? `<span class="pill good">${plural(corrections, "correction")}</span>` : ""}</div>
             ${editing ? "" : `<div class="row">
               <button class="ghost sm" onclick="analysisEditing=true;render()">Correct findings</button>
               <button class="ghost sm" onclick="rebuildAnalysisModal()">Rebuild</button></div>`}
           </div>
           ${analysis.authorNotes ? `<div class="info" style="margin:0 0 12px">
             <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
               <path d="M4 5h16M4 10h16M4 15h10"/></svg>
             <div><b>Your notes for this analysis</b><p style="white-space:pre-wrap">${esc(analysis.authorNotes)}</p>
               <p style="margin-top:6px">Read as part of the material, and kept with the result for the intake agent.</p></div></div>` : ""}
           ${editing
             ? `<div class="choices" style="grid-template-columns:1fr 1fr;margin:0 0 14px">
                  <div><label>Genre</label><input id="an-genre" data-orig="${esc(analysis.genre || "")}" value="${esc(analysis.genre || "")}" placeholder="Romance" /></div>
                  <div><label>Subgenre</label><input id="an-subgenre" data-orig="${esc(analysis.subgenre || "")}" value="${esc(analysis.subgenre || "")}" placeholder="Contemporary romance" /></div>
                </div>`
             : `<div class="info ok" style="margin:0 0 12px">
                  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <path d="M20 6L9 17l-5-5"/>
                  </svg>
                  <div><b>${analysis.genre ? esc(analysis.subgenre || analysis.genre) : "Genre remains an author decision"}</b>
                    <p>${analysis.genre
                      ? (analysis.edits?.genre !== undefined
                        ? "Set by you, so the agent takes it as decided."
                        : `${Math.round((analysis.confidence || 0) * 100)}% confidence. The signal is a prefill, not an imposed decision.`)
                      : "The analysis found no reliable genre signal, so the agent will ask about it only if it remains unresolved."}</p>
                  </div>
                </div>`}
           <h3 style="margin:16px 0 8px">What the material establishes</h3>
           ${editing ? '<div class="hint" style="margin-bottom:8px">Empty a field to say the material does not establish it. The questions the agent asks are rebuilt from whatever you leave here.</div>' : ""}
           <table><tr><th>Area</th><th>Finding</th>${editing ? "" : "<th>Evidence</th>"}</tr>
             ${FINDING_ROWS.map(row).join("")}
           </table>
           ${editing ? `<div class="row" style="margin-top:14px">
             <button onclick="saveAnalysisEdits(this)">Save corrections</button>
             <button class="ghost" onclick="analysisEditing=false;render()">Cancel</button>
             ${corrections ? '<button class="ghost" style="margin-left:auto" onclick="clearAnalysisEdits(this)">Clear all corrections</button>' : ""}
           </div>` : ""}`}
     </div>
    ${editing ? "" : `<div class="row" style="margin-top:14px">
      <button ${complete ? "" : "disabled"} onclick="continueFromAnalysis(this)">Continue</button>
    </div>`}`;
}

function rebuildAnalysisModal() {
  const analysis = S.projectAnalysis || {};
  const corrections = correctionCount(analysis);
  showModal({
    title: "Rebuild the project analysis",
    body: `<p class="hint" style="margin:0 0 12px">The selected material is read again from scratch.
      Anything you write here is read with it, and stays on the record for the intake agent.</p>
      <label>Notes for the analysis</label>
      <textarea id="an-notes" rows="4" placeholder="Mara is the protagonist, not Cole. The timeline document is out of date. The deleted subplot in the chapter notes is not canon.">${esc(analysis.authorNotes || "")}</textarea>
      <div class="hint">Optional.</div>
      ${corrections ? `<label class="opt"><input type="checkbox" id="an-keep" checked />
        Keep my ${plural(corrections, "correction")}</label>
        <div class="hint">Unchecked, the fresh reading stands on its own and your corrections are dropped.</div>` : ""}`,
    actions: `<button onclick="rebuildAnalysis(this)">Rebuild analysis</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>`
  });
}

async function rebuildAnalysis(btn) {
  const keep = document.getElementById("an-keep");
  const body = { notes: document.getElementById("an-notes").value };
  if (keep && !keep.checked) body.keepCorrections = false;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Rebuilding…';
  try {
    S = (await api("/api/intake/analyse", { method: "POST", body })).state;
    closeModal();
    analysisEditing = false;
    toast("Analysis rebuilt."); render();
  } catch (e) { toast(e.message, "error"); closeModal(); render(); }
}

async function saveAnalysisEdits(btn) {
  const body = {};
  const findings = {};
  document.querySelectorAll("[data-finding]").forEach((el) => {
    if (el.value.trim() !== el.dataset.orig) findings[el.dataset.finding] = el.value.trim();
  });
  if (Object.keys(findings).length) body.findings = findings;
  for (const [id, key] of [["an-genre", "genre"], ["an-subgenre", "subgenre"]]) {
    const el = document.getElementById(id);
    if (el && el.value.trim() !== el.dataset.orig) body[key] = el.value.trim();
  }
  if (!Object.keys(body).length) { analysisEditing = false; render(); return; }

  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving…';
  try {
    S = (await api("/api/intake/analysis", { method: "PATCH", body })).state;
    analysisEditing = false;
    toast("Your corrections are what the agents will use."); render();
  } catch (e) { toast(e.message, "error"); render(); }
}

async function clearAnalysisEdits(btn) {
  btn.disabled = true;
  try {
    S = (await api("/api/intake/analysis", { method: "PATCH", body: { clear: true } })).state;
    analysisEditing = false;
    toast("Corrections cleared."); render();
  } catch (e) { toast(e.message, "error"); render(); }
}

async function loadProjectAnalysis() {
  if (projectAnalysisLoading || S.projectAnalysis?.completed) return;
  projectAnalysisLoading = true;
  if (route === "intake_analysis") render();
  try {
    const r = await api("/api/intake/analyse", { method: "POST" });
    S = r.state;
  } catch (e) {
    toast(e.message, "error");
  }
  projectAnalysisLoading = false;
  if (route === "intake_analysis") render();
}

async function startProjectAnalysis(btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Analyzing…';
  await loadProjectAnalysis();
  if (btn.isConnected) {
    btn.disabled = false;
    btn.textContent = "Analyse project";
  }
}

async function continueFromAnalysis(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/intake/analysis/continue", { method: "POST" });
    route = "questions";
    render();
    await loadQuestions();
    startQuestionPolling();
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false;
  }
}

let FINGERPRINT = null;
async function loadFingerprint() {
  const el = document.getElementById("fp"); if (!el) return;
  if (FINGERPRINT) {
    paintFingerprint(el);
    return;
  }
  try {
    const { fingerprint: f, profile } = await api("/api/style/fingerprint");
    FINGERPRINT = { fingerprint: f, profile };
    paintFingerprint(el);
  } catch { el.innerHTML = '<div class="hint">Fingerprint unavailable.</div>'; }
}

function paintFingerprint(el) {
    const { fingerprint: f, profile } = FINGERPRINT;
    const pct = (v) => Math.round(v * 100) + "%";
    const profileRows = profile ? [
      ["Narration", profile.narration.label],
      ["Narration confidence", pct(profile.narration.confidence)],
      ["Narrative distance", profile.distance.label],
      ["Sensory palette", Object.entries(profile.sensory).map(([k, v]) => `${k} ${v}/1k`).join(", ")],
      ["Explicit emotion", profile.emotion.explicitPer1k + "/1k"],
      ["Body-cue emotion", profile.emotion.bodyCuePer1k + "/1k"],
      ["Figurative language", profile.figurative.similesPer1k + " similes/1k"],
      ["Suggested audience", profile.audience.values.join(", ") || "No strong signal"],
      ["Suggested intimacy", profile.intimacy.value]
    ] : [];
    el.innerHTML = `${profile ? `<h3 style="margin:0 0 8px">Writing profile</h3>
      <table><tr><th>Signal</th><th class="num">Measured reading</th></tr>
        ${profileRows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${esc(v)}</td></tr>`).join("")}</table>
        <div class="hint" style="margin-top:10px"><b>Dialogue split:</b> this is the measured share of words inside quotation marks. The rest is non-dialogue prose.</div>
        ${profile.evidence?.length ? `<div class="hint" style="margin-top:6px"><b>Evidence:</b> ${profile.evidence.map(esc).join(" ")}</div>` : ""}
      </div>` : ""}
      <h3 style="margin:18px 0 8px">Prose fingerprint</h3>
      <table><tr><th>Measure</th><th class="num">Your target</th></tr>
      ${[["Mean sentence length", f.sentence.meanWords + " words"],
         ["Sentence length variation", f.sentence.stdevWords],
         ["Fragment rate", pct(f.sentence.fragmentRate)],
         ["Mean paragraph length", f.paragraph.meanWords + " words"],
          ["Dialogue", pct(f.dialogue.wordShare)],
          ["Description / narration", pct(1 - f.dialogue.wordShare)],
         ["Mean dialogue line", f.dialogue.meanLineWords + " words"],
         ["Plain dialogue tags", pct(f.dialogue.invisibleTagShare)],
         ["-ly adverbs / 1k", f.texture.lyAdverbsPer1k],
         ["Filter verbs / 1k", f.texture.filterVerbsPer1k],
          ["Abstract nouns / 1k", f.texture.abstractNounsPer1k],
          ["Similes / 1k", f.texture.similesPer1k],
          ["Vocabulary variety", f.texture.typeTokenRatio]]
          .map(([k, v]) => `<tr><td>${k}</td><td class="num">${v}</td></tr>`).join("")}</table>`;
}

function viewQuestions() {
  const qs = S.questions || [];
  const conversation = S.conversation || [];
  const open = qs.filter((q) => q.answer === undefined);
  const done = qs.filter((q) => q.answer !== undefined);
  const started = Boolean(S.conversationStartedAt || qs.length || conversation.length);
  const readyToStart = started && !open.length;
  const plan = S.projectAnalysis?.questionPlan || [];
  const pending = plan.filter((p) => !(S.intake || {})[p.key] && !qs.some((q) => q.key === p.key));
  const card = (q) => `<div class="card q ${q.answer !== undefined ? "answered" : ""}">
    <div class="meta">${esc(q.askedBy)} · ${esc(q.phase)}${q.blocking ? ' · <span style="color:var(--bad)">blocking</span>' : ""}</div>
    <div class="text">${esc(q.question)}</div>
    ${q.rationale ? `<div class="why">${esc(q.rationale)}</div>` : ""}
    ${q.answer !== undefined
      ? `<div class="answer-box"><b>Answered:</b> ${esc(q.answer)}</div>`
      : `${q.options?.length ? `<div class="opts">${q.options.map((o) =>
            `<button class="opt" onclick="answer('${q.id}', ${JSON.stringify(o).replace(/"/g, "&quot;")})">${esc(o)}</button>`).join("")}</div>` : ""}
         ${q.allowFreeText ? `<div class="row">
            <input id="a-${q.id}" placeholder="Type your answer…"
              onkeydown="if(event.key==='Enter')answer('${q.id}', this.value)" />
            <button onclick="answer('${q.id}', document.getElementById('a-${q.id}').value)">Answer</button></div>` : ""}`}
  </div>`;

  return `
  <h1>Questions</h1>
  <p class="sub">The intake agent has already read the project analysis. It asks one evidence-backed question at a time only when the selected material cannot safely decide something for you. Blocking questions hold the pipeline.</p>
  ${!started && !pending.length ? `<div class="card" style="border-color:var(--accent)">
    <b>No questions</b>
    <p class="sub" style="margin:6px 0 12px">${plan.length
      ? "Every gap the analysis found is already decided, so there is nothing for the intake agent to ask."
      : "The analysis found no gap that needs an author decision, so there is nothing for the intake agent to ask."}
      If that looks wrong, correct the analysis and the questions are rebuilt from your version.
      Continuing closes preparation: the earlier screens stay readable but stop being editable.</p>
    <div class="row">
      <button onclick="continueToChapters(this)">Continue</button>
      <button class="ghost" onclick="go('intake_analysis')">Back to the analysis</button>
    </div>
  </div>` : !started ? `<div class="card">
    <b>Ready to begin intake</b>
    <p class="sub" style="margin:6px 0 12px">${plural(pending.length, "question")} ${verb(pending.length, "is", "are")} prepared from the analysis. They come one at a time, and the next will not appear until you answer it.</p>
    <button onclick="beginIntake(this)">Begin intake</button>
  </div>` : `${open.length ? `<h2>Waiting on you (${open.length})</h2>${open.map(card).join("")}` : ""}
     ${done.length ? `<h2>Answered (${done.length})</h2>${done.map(card).join("")}` : ""}
     ${readyToStart ? `<div class="card" style="margin-top:18px;border-color:var(--accent)">
       <b>Preparation questions complete</b>
       <p class="sub" style="margin:6px 0 12px">Review the decisions above. Continuing closes preparation and takes
       you to the chapter board, where you start the writing when you are ready. The earlier screens stay
       readable but stop being editable, because they become the contract the writing is held to.</p>
       <button onclick="continueToChapters(this)">Continue</button>
     </div>` : ""}`}
  `;
}

function intakeWaitingCard() {
  const started = Date.parse(S.conversationStartedAt || "") || Date.now();
  const elapsed = Math.max(0, Math.floor((Date.now() - started) / 1000));
  const phases = [
    [0, "Getting started", "Opening the intake conversation."],
    [5, "Reviewing the project", "Checking the project shape, selected draft, and continuation notes."],
    [12, "Analyzing references", "Reading the indexed material and style signals."],
    [22, "Preparing the first question", "The agent is deciding what it needs from you first."],
    [45, "Still working", "This can take a minute for a large reference set. Your project is saved."]
  ];
  const current = phases.reduce((chosen, phase) => elapsed >= phase[0] ? phase : chosen, phases[0]);
  const progress = Math.min(92, 18 + elapsed * 1.7);
  return `<div class="card" style="padding:22px 18px">
    <div class="row"><span class="spin spin-lg"></span><b>${current[1]}</b><span class="pill">${elapsed}s</span></div>
    <p class="sub" style="margin:12px 0 10px">${current[2]}</p>
    <div class="meter" style="width:100%;height:5px"><i style="width:${progress}%"></i></div>
    <div class="hint" style="margin-top:8px">The first question will appear here when the intake agent is ready.</div>
  </div>`;
}

async function loadQuestions() {
  try {
    const r = await api("/api/questions");
    const nextSnapshot = JSON.stringify({ questions: r.questions || [], conversation: r.conversation || [], conversationStartedAt: r.conversationStartedAt || null });
    if (nextSnapshot === questionSnapshot) return;
    questionSnapshot = nextSnapshot;
    if (S) S.questions = r.questions || [];
    if (S) S.conversation = r.conversation || S.conversation || [];
    if (S) S.conversationStartedAt = r.conversationStartedAt || S.conversationStartedAt || null;
    if (route === "questions" && S.writingConfirmed) {
      stopQuestionPolling();
      route = "chapters";
    }
    if (route === "questions" || route === "chapters") render();
  } catch { /* the state already contains the last known conversation */ }
}

async function beginIntake(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/conversation/start", { method: "POST" });
    if (S.questions.length === 0) {
      route = "questions";
      toast("No author decisions remain. Review the preparation and start writing when ready.");
      render();
      return;
    }
    render();
    startQuestionPolling();
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false;
  }
}

function startQuestionPolling() {
  if (questionPoll) return;
  questionPoll = setInterval(loadQuestions, 3000);
}

function stopQuestionPolling() {
  if (!questionPoll) return;
  clearInterval(questionPoll);
  questionPoll = null;
}

/** The plan and the drafts are written by a runtime the Studio does not own. */
function enterChapters() {
  startChapterPolling();
  loadRuntime();
  loadPreparationStatus();
  loadRunOutput();
  if (S?.run?.status === "running") startRunPolling();
  else if (["halted", "complete"].includes(S?.run?.status)) pollRun();
}

function startChapterPolling() {
  if (chapterPoll) return;
  chapterPoll = setInterval(pollChapters, 5000);
}

async function pollChapters() {
  if (route !== "chapters") { stopChapterPolling(); return; }
  // Re-rendering under the cursor would eat whatever is being typed.
  const active = document.activeElement;
  if (document.getElementById("modal")) return;
  if (active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")) return;
  try {
    const r = await api("/api/state");
    const snapshot = JSON.stringify({ chapters: r.state.chapters, run: r.state.run, phase: r.state.phase });
    if (snapshot === chapterSnapshot) return;
    chapterSnapshot = snapshot;
    S = r.state;
    PROJECTS = r.projects || PROJECTS;
    render();
  } catch { /* the board keeps the last state it knew */ }
}

function stopChapterPolling() {
  stopRunPolling();
  if (!chapterPoll) return;
  clearInterval(chapterPoll);
  chapterPoll = null;
}

async function answer(id, text) {
  if (!text || !String(text).trim()) return;
  try { S = await api(`/api/questions/${id}/answer`, { method: "POST", body: { answer: String(text) } });
    if (S.writingConfirmed) {
      stopQuestionPolling();
      route = "chapters";
      toast("Intake complete. Moving to chapters.");
    } else {
      toast("Answer recorded.");
    }
    render(); }
  catch (e) { toast(e.message, "error"); }
}

async function continueToChapters(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/writing/confirm", { method: "POST" });
    stopQuestionPolling();
    collapsedGroups["Set up"] = true;
    collapsedGroups.Prepare = true;
    route = "chapters";
    render();
    startChapterPolling();
    loadRuntime();
    loadPreparationStatus();
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

async function reopenPreparation(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/writing/reopen", { method: "POST" });
    toast("Preparation is open again. Confirm it when you are ready to write.");
    render();
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

let RUNTIME = null;
let PREP_RUNTIME = null;
let PREPARATION = null;
let PREP_DOCS = null;
let WRITING_ESTIMATE = null;
let PREPARATION_CHECKLIST_OPEN = false;

async function loadRuntime() {
  try { RUNTIME = await api("/api/run/runtime"); if (route === "chapters") render(); }
  catch { /* the start button explains itself when this is unknown */ }
}

async function loadPreparationStatus() {
  try {
    const previousStatus = JSON.stringify(PREPARATION);
    const previousDocuments = PREP_DOCS?.filter((doc) => doc.available).length ?? -1;
    PREPARATION = await api("/api/preparation/status");
    if (!PREPARATION.ready && !PREP_RUNTIME) loadPreparationRuntime();
    const loaded = PREP_DOCS?.filter((doc) => doc.available).length ?? -1;
    if ((PREPARATION.ready || PREPARATION.present?.length) && loaded !== PREPARATION.present.length) await loadPreparationDocuments();
    const documentsChanged = (PREP_DOCS?.filter((doc) => doc.available).length ?? -1) !== previousDocuments;
    if (route === "chapters" && (JSON.stringify(PREPARATION) !== previousStatus || documentsChanged)) render();
  }

}

function preparationChecklist(status, collapsed = false) {
  const present = status?.present || [];
  const missing = status?.missing || [];

  const list = (items, className, empty) => items.length
    ? `<ul>${items.map((name) => `<li class="${className}">${esc(name)}</li>`).join("")}</ul>`
    : `<div class="hint" style="margin-top:5px">${empty}</div>`;
  const content = `<div class="prep-status">
    <div class="prep-status-head"><b>Preparation package: ${present.length}/${total} documents ready</b><code>${esc(status?.artifactDirectory || "workspaces/<book>/artifacts/")}</code></div>
    <div class="prep-status-grid">
      <div><b>Ready</b>${list(present, "done", "None yet")}</div>
      <div><b>Pending</b>${list(missing, "pending", "All required documents are present")}</div>
    </div>
  </div>`;
  return collapsed ? `<details class="prep-status-details" ${PREPARATION_CHECKLIST_OPEN ? "open" : ""} ontoggle="PREPARATION_CHECKLIST_OPEN = this.open"><summary>Show completed and pending documents</summary>${content}</details>` : content;

function preparationDocumentsCard() {
  const documents = (PREP_DOCS || []).map((doc, index) => ({ doc, index })).filter(({ doc }) => doc.available);

    <h3>Documents ready to read</h3>
    <div class="items">${documents.map(({ doc, index }) => `<button class="ghost" onclick="openPreparationDocument(${index})"><b>${esc(doc.name)}</b><span>Open</span></button>`).join("")}</div>

    title: doc.name,

      <div class="prep-reader prep-rendered">${doc.rendered || esc(doc.content || "")}</div>

    actions: `<button onclick="savePreparationDocumentNote(${index}, '${esc(doc.name).replace(/'/g, "\\'")}', this)">Save note</button>
      <a class="btn ghost sm" href="/api/preparation/documents/${encodeURIComponent(doc.name)}/view" target="_blank" rel="noopener">View / print PDF</a>

async function startPreparationRun(btn) {

    const r = await api("/api/preparation/run", { method: "POST" });
    S = r;
    PREP_RUNTIME = { runtime: r.runtime, label: r.runtimeLabel, model: r.model };
    closeModal();
    route = "chapters";
    runEvents = [];
    runLatest = 0;
    runProgress = null;
    runOutput = null;
    render();
    startRunPolling();
    toast(`${r.runtimeLabel || "The runtime"} is preparing the book.`);
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false;
    btn.textContent = "Prepare everything";

async function startWriting(btn) {
  const note = document.getElementById("run-note")?.value || "";
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Starting…';
  try {
    const r = await api("/api/run/start", { method: "POST", body: { note } });
    S = r;

    runEvents = [];
    runLatest = 0;
    runProgress = null;
    runOutput = null;
    showRunConsole = false;
    render();
    startRunPolling();
    toast(`${r.runtimeLabel || "The runtime"} is working.`);
  } catch (e) {
    closeModal();
    if (/^Preparation is not ready\./.test(e.message)) {
      try { showPreparationRequired(await api("/api/preparation/status")); }

async function stopWriting(btn) {
  btn.disabled = true;
  try { S = await api("/api/run/stop", { method: "POST" }); render(); }
  catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

let runEvents = [];
let runLatest = 0;
let runPoll = null;
let elapsedTicker = null;
let runConsoleScrollTop = 0;
let runConsoleAtBottom = true;

function startRunPolling() {
  if (runPoll) return;
  runPoll = setInterval(pollRun, 1500);
  elapsedTicker = setInterval(updateElapsed, 1000);
  pollRun();
}

function stopRunPolling() {
  if (runPoll) {
    clearInterval(runPoll);
    runPoll = null;
  }
  if (elapsedTicker) {
    clearInterval(elapsedTicker);
    elapsedTicker = null;
  }
}

async function pollRun() {
  try {
    if (PREPARATION && !PREPARATION.ready) await loadPreparationStatus();
    const snapshot = await api(`/api/run/events?since=${runLatest}`);
    const progressChanged = JSON.stringify(snapshot.progress || null) !== JSON.stringify(runProgress || null);
    runProgress = snapshot.progress || runProgress;
    if (snapshot.events.length) {
      runEvents = [...runEvents, ...snapshot.events].slice(-400);
      runLatest = snapshot.latest;
    }
    if (progressChanged && route === "chapters") render();
    else if (snapshot.active && route === "chapters") {
      if (snapshot.events.length && showRunConsole) renderRunLog();
      updateElapsed();
    }
    if (!snapshot.active) {
       stopRunPolling();
       await loadRunOutput();
       await reload();
       await loadPreparationStatus();
    }
  } catch { /* a missed poll is caught by the next one */ }
}

function renderRunLog() {
  const log = document.getElementById("runlog");
  if (!log) { render(); return; }
  rememberRunConsolePosition(log);
  log.innerHTML = runEvents.map(runLine).join("");
  restoreRunConsolePosition(log);
}

function rememberRunConsolePosition(log) {
  if (!log) return;
  runConsoleScrollTop = log.scrollTop;
  runConsoleAtBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
}

function restoreRunConsolePosition(log = document.getElementById("runlog")) {
  if (!log) return;
  log.scrollTop = runConsoleAtBottom ? log.scrollHeight : runConsoleScrollTop;
  updateConsoleFollowButton();
}

function updateElapsed() {
  const elapsed = document.getElementById("run-elapsed");
  if (!elapsed || !S?.run?.startedAt) return;
  elapsed.textContent = formatElapsed(Math.floor((Date.now() - Date.parse(S.run.startedAt)) / 1000));
}

function updateConsoleFollowButton() {
}

function jumpRunConsoleToBottom() {
  runConsoleAtBottom = true;
  const log = document.getElementById("runlog");
  if (log) log.scrollTop = log.scrollHeight;
  updateConsoleFollowButton();
}

function runLine(event) {
  const time = new Date(event.at).toLocaleTimeString();
  return `<div class="runline ${event.kind}"><span class="t">${time}</span><span>${esc(event.text)}</span></div>`;
}

function formatElapsed(totalSeconds) {
  const seconds = Math.max(0, totalSeconds);
  const days = Math.floor(seconds / 86400);
  const hours = Math.floor((seconds % 86400) / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const remainder = seconds % 60;
  const parts = [];
  if (days) parts.push(`${days}d`);
  if (days || hours) parts.push(`${hours}h`);
  if (days || hours || minutes) parts.push(`${minutes}m`);
  parts.push(`${remainder}s`);
  return parts.join(" ");
}

async function loadRunOutput() {
  try {
    runOutput = await api("/api/run/output");
    if (route === "chapters") render();
  } catch { /* output is optional until a chapter or final manuscript exists */ }
}

function progressForRun(run) {
  if (runProgress) return runProgress;
  if (run.status === "complete") return { label: "Writing complete", percent: 100, detail: "The runtime finished. Checking the finished output.", chapter: run.chapter || null };
  if (run.status === "halted") return { label: "Run stopped", percent: 0, detail: "The run stopped before it finished.", chapter: run.chapter || null };
  return { label: "Getting started", percent: 5, detail: "Starting the writing runtime.", chapter: run.chapter || null };
}

function runPanel(run) {
  const running = run.status === "running";
  const preparing = running && ((PREPARATION && !PREPARATION.ready) || S.phase === "preparation");
  const elapsed = run.startedAt ? Math.floor((Date.now() - Date.parse(run.startedAt)) / 1000) : 0;
  const progress = progressForRun(run);
  const phaseLabel = preparing
    ? "Preparing everything"
    : progress.chapter && progress.phase === "writing_chapter"
    ? `Writing Chapter ${progress.chapter}`
    : progress.chapter && progress.phase === "editing_chapter"
      ? `Editing Chapter ${progress.chapter}`
      : progress.chapter && progress.phase === "validating_chapter"
        ? `Checking Chapter ${progress.chapter}`
        : `${progress.label}${progress.chapter ? ` (Chapter ${progress.chapter})` : ""}`;
  const workText = S?.draftingMode === "whole_book" ? "the whole book" : "the book";
  const progressDetail = preparing
    ? preparationProgressDetail(progress)
    : progress.detail;
  const runtimeInfo = preparing ? (PREP_RUNTIME || RUNTIME) : RUNTIME;
  return `<div class="card" ${running ? 'style="border-color:var(--accent)"' : ""}>
    <div class="row spread" style="margin-bottom:10px">
      <div class="row">
        ${running ? '<span class="spin"></span>' : ""}
        <b>${preparing ? "Preparing book" : running ? (progress.chapter ? `Writing Chapter ${progress.chapter}` : `Writing ${workText}`) : run.status === "complete" ? "Writing complete" : "The last run"}</b>
        ${runtimeInfo?.label ? `<span class="pill">${esc(runtimeInfo.label)}</span>` : ""}
         ${runtimeInfo?.model ? `<span class="pill">${esc(runtimeInfo.model)}</span>` : ""}
       </div>
       ${running ? `<div class="row" style="gap:6px"><span id="run-elapsed" class="pill" aria-label="Elapsed time">${formatElapsed(elapsed)}</span><button class="ghost sm" onclick="stopWriting(this)">Stop</button></div>` : ""}
    </div>
    <div class="run-progress" aria-live="polite">
      <div class="run-progress-head"><b>${esc(phaseLabel)}</b><span>${Math.round(progress.percent)}%</span></div>
       <div class="meter"><i style="width:${Math.max(0, Math.min(100, progress.percent))}%"></i></div>
       <div class="run-progress-detail">${esc(progressDetail)}</div>
       ${preparing && PREPARATION ? preparationChecklist(PREPARATION, true) : ""}
       ${preparing ? preparationDocumentsCard() : ""}
     </div>
    <div class="row" style="margin-top:10px;justify-content:flex-end">
      <button class="ghost sm console-toggle" title="Show the runtime console" aria-label="Show the runtime console"
         onclick="toggleRunConsole()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h16v14H4z"/><path d="m7 9 3 3-3 3M12 15h5"/>
         </svg>${showRunConsole ? "Hide technical details" : "Show technical details"}
      </button>
    </div>
     ${showRunConsole ? `<div id="runlog" class="runlog" onscroll="rememberRunConsolePosition(this)">${runEvents.map(runLine).join("") || '<div class="runline"><span>Waiting for the first step.</span></div>'}</div>` : ""}
    ${running ? '<div class="hint" style="margin-top:8px">Leave this open or close it: the runtime keeps going either way, and the board updates as chapters land.</div>' : ""}
  </div>`;
}

function toggleRunConsole() {
  showRunConsole = !showRunConsole;
  render();
}

function preparationProgressDetail(progress) {
  switch (progress.phase) {
    case "gathering_info": return "Reading the selected sources and author decisions.";
    case "preparing_characters": return "Building the character, relationship, and inherited-knowledge record.";
    case "planning_chapters": return "Turning the approved material into the plot and chapter plan.";
    case "finishing": return "Writing the remaining preparation documents and checking the manifest.";
    default: return "Completing the preparation package.";
  }
}

function outputCard() {
  const primary = runOutput?.primary;
  if (!primary) return "";
  const files = runOutput.files || [];
  const grouped = [...new Map(files.map((file) => [`${file.kind}-${file.chapter ?? "book"}`, []])).keys()]
    .map((key) => files.filter((file) => `${file.kind}-${file.chapter ?? "book"}` === key));
  const fileLink = (file) => {
    const view = file.format === "md"
      ? `<a class="btn ghost sm" href="/api/run/output/view?kind=${file.kind}${file.chapter ? `&chapter=${file.chapter}` : ""}" target="_blank" rel="noopener">View / print PDF</a>`
      : `<a class="btn ghost sm" href="${esc(file.downloadUrl)}" download>Download DOCX</a>`;
    return view;
  };
  const fileGroup = (group) => `<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)">
    <span>${esc(group[0].label)}</span><span class="row">${group.map(fileLink).join("")}</span></div>`;
  const finalFiles = files.filter((file) => file.kind === "book");
  const chapterGroups = grouped.filter((group) => group[0].kind === "chapter");
  return `<div class="card" style="border-color:var(--good)">
    <div class="spread" style="margin-bottom:10px">
      <div><b>${esc(primary.label)} is ready</b><div class="hint">Your finished ${primary.kind === "book" ? "book" : "chapter"} is available below.</div></div>
      ${fileLink(primary)}
    </div>
    ${primary.preview ? `<div class="output-preview ${primary.truncated ? "truncated" : ""}">${esc(primary.preview)}</div>
      ${primary.truncated ? '<div class="hint" style="margin-top:7px">Preview shortened here. The download contains the complete output.</div>' : ""}` : '<div class="hint">The output is ready to download.</div>'}
    ${finalFiles.length ? `<div style="margin-top:18px"><div class="spread"><h3 style="margin:0 0 4px">Final book</h3><button class="ghost sm" onclick="retouchBookModal()">Retouch final book</button></div>${fileGroup(finalFiles)}</div>` : ""}
    ${chapterGroups.length ? `<div style="margin-top:18px"><h3 style="margin:0 0 4px">Chapters</h3>${chapterGroups.map(fileGroup).join("")}</div>` : ""}
  </div>`;
}
