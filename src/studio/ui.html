async function useAsDraft(driveId, name, btn) {
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Reading…';
  try {
    const r = await api("/api/manuscript/analyse", { method: "POST", body: { driveId } });
    S = r.state; render();
    await loadDraftAnalysis();
    toast(`Read ${plural(r.analysis.totalWords, "word", null, r.analysis.totalWords.toLocaleString())} from "${name}".`);
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false; btn.textContent = "Select";
  }
}

async function skipDraft(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/manuscript/skip", { method: "POST" });
    route = "style";
    render();
    toast("Starting from the first line.");
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false;
  }
}

async function setDraftTarget(target) {
  try { S = await api("/api/manuscript", { method: "PATCH", body: { target } }); render(); }
  catch (e) { toast(e.message, "error"); }
}

async function continueDraft(btn) {
  const notes = document.getElementById("manuscript-notes")?.value || "";
  btn.disabled = true;
  try {
    S = await api("/api/manuscript", { method: "PATCH", body: { notes } });
    route = "style";
    render();
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false;
  }
}

async function clearDraft(btn) {
  btn.disabled = true;
  try { S = await api("/api/manuscript", { method: "DELETE" }); render(); loadBrowse(browse.folderId); }
  catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

function openDraftPicker() { draftPicker = true; loadBrowse(browse.folderId); render(); }
function closeDraftPicker() { draftPicker = false; render(); }

function viewDraft() {
  return `<h1>Existing draft</h1>${draftSection()}`;
}

async function loadDraftAnalysis() {
  if (!S?.manuscript || draftAnalysisLoading) return;
  draftAnalysisLoading = true;
  if (route === "draft") render();
  try {
    const r = await api("/api/manuscript/reanalyse", { method: "POST" });
    S = r.state;
  } catch (e) {
    toast(`Could not refresh the draft analysis: ${e.message}`, "warn");
  }
  draftAnalysisLoading = false;
  if (route === "draft") render();
}

function viewStyle() {
  const sc = S.styleCorpus;
  const books = S.sources.filter((s) => (s.kinds || []).includes("past_book"));
  const refs = S.sources.filter((s) => (s.kinds || []).includes("reference_book"));
  const usingReference = books.length === 0 && refs.length > 0;
  const canBuild = S.sourcesReviewed && (books.length > 0 || refs.length > 0);
  return `
  <h1>Style corpus</h1>
  <p class="sub">This is what stops the writing sounding generic. Canon Quill cuts your past books
  into passages, tags each by the kind of beat it carries, and measures your prose. When a chapter
  is drafted, real passages of yours for that same beat go into the prompt, and the result is
  scored against your measured fingerprint, not against a generic idea of good writing.</p>

  <div class="card spread">
    <div><b>${books.length
        ? plural(books.length, "document") + " of your writing"
        : usingReference ? plural(refs.length, "document") + " of reference writing" : "Nothing to learn from"}</b>
      <div class="hint">${(books.length ? books : refs).map((b) => esc(b.name)).join(", ")
        || "Mark something as Your writing on the Analyse screen."}</div>
      ${usingReference ? '<div class="hint" style="color:var(--warn);margin-top:4px">No writing of your own is marked, so this will learn from reference writing. The book will read like its author rather than like you.</div>' : ""}</div>
    <button ${canBuild ? "" : "disabled"} onclick="buildStyle(this)">${sc.built ? "Rebuild style corpus" : "Build style corpus"}</button>
  </div>

  ${sc.built ? `<div class="card">
    <div class="row" style="margin-bottom:10px"><b>Corpus built</b>
      <span class="pill good">${plural(sc.passageCount, "passage")}</span>
      <span class="pill">${plural(sc.wordCount, "word", null, sc.wordCount.toLocaleString())}</span></div>
    ${sc.wordCount < 2000 ? '<div class="hint" style="color:var(--warn)">Under 2,000 words, so the fingerprint will be noisy. Add more of your prose.</div>' : ""}
    <div id="fp"><span class="spin"></span></div>
    <div class="row" style="margin-top:16px">
      <button onclick="continueFromStyle(this)">Continue to questions</button>
    </div>
    <div class="hint" style="margin-top:8px">The questions screen is where the writing agent records decisions instead of guessing.</div>
    </div>` : ""}
  ${!canBuild ? '<div class="hint" style="color:var(--warn);margin-top:8px">Review the source grouping and mark reference material before building the corpus.</div>' : ""}`;
}

async function buildStyle(btn) {
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Building…';
  try {
    const books = S.sources.filter((x) => (x.kinds || []).includes("past_book"));
    S = await api("/api/style/build", { method: "POST", body: { useReference: books.length === 0 } });
    toast("Style corpus built."); render(); loadFingerprint();
  }
  catch (e) { toast(e.message, "error"); render(); }
}

async function continueFromStyle(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/style/continue", { method: "POST" });
    route = "questions";
    render();
    await loadQuestions();
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false;
  }
}

let FINGERPRINT = null;
async function loadFingerprint() {
  const el = document.getElementById("fp"); if (!el) return;
  try {
    const { fingerprint: f, profile } = await api("/api/style/fingerprint");
    FINGERPRINT = { fingerprint: f, profile };
    const pct = (v) => Math.round(v * 100) + "%";
    const profileRows = profile ? [
      ["Narration", profile.narration.label],
      ["Narration confidence", pct(profile.narration.confidence)],
      ["Narrative distance", profile.distance.label],
      ["Sensory palette", Object.entries(profile.sensory).map(([k, v]) => `${k} ${v}/1k`).join(", ")],
      ["Scene beats", Object.entries(profile.beats).map(([k, v]) => `${k} ${pct(v)}`).join(", ")],
      ["Explicit emotion", profile.emotion.explicitPer1k + "/1k"],
      ["Body-cue emotion", profile.emotion.bodyCuePer1k + "/1k"],
      ["Figurative language", profile.figurative.similesPer1k + " similes/1k"],
      ["Suggested audience", profile.audience.values.join(", ") || "No strong signal"],
      ["Suggested intimacy", profile.intimacy.value]
    ] : [];
    el.innerHTML = `${profile ? `<h3 style="margin:0 0 8px">Writing profile</h3>
      <table><tr><th>Signal</th><th class="num">Measured reading</th></tr>
        ${profileRows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${esc(v)}</td></tr>`).join("")}</table>
        ${profile.evidence?.length ? `<div class="hint" style="margin-top:10px"><b>Evidence:</b> ${profile.evidence.map(esc).join(" ")}</div>` : ""}
      </div>` : ""}
      <h3 style="margin:18px 0 8px">Prose fingerprint</h3>
      <table><tr><th>Measure</th><th class="num">Your target</th></tr>
      ${[["Mean sentence length", f.sentence.meanWords + " words"],
         ["Sentence length variation", f.sentence.stdevWords],
         ["Fragment rate", pct(f.sentence.fragmentRate)],
         ["Mean paragraph length", f.paragraph.meanWords + " words"],
         ["Dialogue share", pct(f.dialogue.wordShare)],
         ["Mean dialogue line", f.dialogue.meanLineWords + " words"],
         ["Plain dialogue tags", pct(f.dialogue.invisibleTagShare)],
         ["-ly adverbs / 1k", f.texture.lyAdverbsPer1k],
         ["Filter verbs / 1k", f.texture.filterVerbsPer1k],
         ["Abstract nouns / 1k", f.texture.abstractNounsPer1k],
         ["Similes / 1k", f.texture.similesPer1k],
         ["Vocabulary variety", f.texture.typeTokenRatio]]
         .map(([k, v]) => `<tr><td>${k}</td><td class="num">${v}</td></tr>`).join("")}</table>`;
  } catch { el.innerHTML = '<div class="hint">Fingerprint unavailable.</div>'; }
}

function viewQuestions() {
  const qs = S.questions || [];
  const conversation = S.conversation || [];
  const open = qs.filter((q) => q.answer === undefined);
  const done = qs.filter((q) => q.answer !== undefined);
  const card = (q) => `<div class="card q ${q.answer !== undefined ? "answered" : ""}">
    <div class="meta">${esc(q.askedBy)} · ${esc(q.phase)}${q.blocking ? ' · <span style="color:var(--bad)">blocking</span>' : ""}</div>
    <div class="text">${esc(q.question)}</div>
    ${q.rationale ? `<div class="why">${esc(q.rationale)}</div>` : ""}
    ${q.answer !== undefined
      ? `<div class="answer-box"><b>Answered:</b> ${esc(q.answer)}</div>`
      : `${q.options?.length ? `<div class="opts">${q.options.map((o) =>
            `<button class="opt" onclick="answer('${q.id}', ${JSON.stringify(o).replace(/"/g, "&quot;")})">${esc(o)}</button>`).join("")}</div>` : ""}
         ${q.allowFreeText ? `<div class="row">
            <input id="a-${q.id}" placeholder="Type your answer…"
              onkeydown="if(event.key==='Enter')answer('${q.id}', this.value)" />
            <button onclick="answer('${q.id}', document.getElementById('a-${q.id}').value)">Answer</button></div>` : ""}`}
  </div>`;

  return `
  <h1>Questions</h1>
  <p class="sub">When an agent hits a decision only you can make, it asks here instead of guessing
  and burying the assumption in a document. Blocking questions hold the pipeline.</p>
  <div class="row" style="margin-bottom:12px">
    <button class="ghost sm" onclick="loadQuestions()">Refresh conversation</button>
    <span class="hint">Questions and answers are recorded in this book's project log.</span>
  </div>
  <div class="card">
    <label>Conversation with the writing agent</label>
    ${conversation.length ? `<div style="display:grid;gap:7px;margin:8px 0 12px">
      ${conversation.map((message) => `<div class="answer-box" style="border-left:3px solid var(--${message.role === "author" ? "good" : "accent"})">
        <b>${message.role === "author" ? "You" : "Agent"}</b> · ${new Date(message.createdAt).toLocaleString()}<br>${esc(message.text)}
      </div>`).join("")}
    </div>` : '<div class="empty" style="padding:12px">The conversation starts here.</div>'}
    <textarea id="conversation-message" rows="3" placeholder="Tell the agent what matters about this book..."></textarea>
    <div class="row" style="margin-top:8px"><button onclick="sendConversation(this)">Send message</button></div>
  </div>
  ${open.length ? `<h2>Waiting on you (${open.length})</h2>${open.map(card).join("")}`
    : '<div class="card empty">Nothing waiting. Agents will post questions here as they work.</div>'}
  ${done.length ? `<h2>Answered (${done.length})</h2>${done.map(card).join("")}` : ""}`;
}

async function loadQuestions() {
  try {
    const r = await api("/api/questions");
    if (S) S.questions = r.questions || [];
    if (S) S.conversation = r.conversation || S.conversation || [];
    if (route === "questions") render();
  } catch { /* the state already contains the last known conversation */ }
}

async function sendConversation(btn) {
  const box = document.getElementById("conversation-message");
  const text = box?.value?.trim();
  if (!text) { toast("Write the message first.", "warn"); return; }
  btn.disabled = true;
  try {
    S = await api("/api/conversation", { method: "POST", body: { text } });
    render();
    toast("Message recorded.");
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false;
  }
}

async function answer(id, text) {
  if (!text || !String(text).trim()) return;
  try { S = await api(`/api/questions/${id}/answer`, { method: "POST", body: { answer: String(text) } });
    toast("Answer recorded."); render(); }
  catch (e) { toast(e.message, "error"); }
}

function viewChapters() {
  const cs = S.chapters || [];
  const mode = S.draftingMode;
  const run = S.run || {};
  const dirs = S.directions || [];
  const pending = dirs.filter((d) => !d.appliedAt);

  const HALTS = {
    no_credit: ["Out of credit", "The provider accepted the credentials but there is nothing left to spend. Add credit or raise the billing limit, then resume."],
    rate_limited: ["Rate limited or capped", "Either too many requests too quickly, or a plan usage cap was reached. Waiting usually clears the first; a cap may need until the period resets."],
    invalid_credentials: ["Credentials rejected", "The key or sign-in was refused. It may have been revoked, deleted or replaced. Fix it under Writing engine, then resume."],
    provider_error: ["The provider failed", "Something went wrong on their side. Usually worth resuming after a moment."],
    cancelled: ["Stopped by you", "Resume whenever you are ready."],
    other: ["Drafting stopped", "The run did not finish."]
  };

  const haltCard = run.status === "halted" ? (() => {
    const [title, help] = HALTS[run.reason] || HALTS.other;
    return `<div class="card" style="border-color:var(--bad)">
      <div class="row" style="margin-bottom:6px">
        <b style="color:var(--bad)">${title}</b>
        ${run.chapter ? `<span class="pill">stopped on chapter ${run.chapter}</span>` : ""}
        ${run.haltedAt ? `<span class="pill">${new Date(run.haltedAt).toLocaleString()}</span>` : ""}
      </div>
      <p class="sub" style="margin:0 0 8px">${help}</p>
      ${run.detail ? `<div class="steplog">${esc(run.detail)}</div>` : ""}
      <p class="hint" style="margin:10px 0 0">Everything approved so far is kept. Resuming picks up at the
      first chapter that is not finished, after re-checking your credentials.</p>
      <div class="row" style="margin-top:12px">
        <button onclick="resumeRun(this)">Resume</button>
        <button class="ghost" onclick="go('engine')">Check writing engine</button>
      </div>
    </div>`;
  })() : "";

  if (!cs.length) return `<h1>Chapters</h1>
    ${haltCard}
    <p class="sub">No chapter plan yet. The preparation phase writes one; it will appear here.</p>
    ${directionsCard(pending, dirs)}`;

  const approved = cs.filter((c) => c.status === "approved").length;
  return `
  <h1>Chapters</h1>
  <p class="sub">${mode === "chapter_by_chapter"
      ? "<b>Chapter-by-chapter mode.</b> Each chapter stops here for your approval before the next one starts."
      : mode === "whole_book"
        ? "<b>Whole-book mode.</b> All chapters are drafted and validated in one pass; you review the finished manuscript."
        : "Pick a drafting mode under Project shape."}</p>

  ${haltCard}

  <div class="card spread">
    <div><b>${approved} of ${plural(cs.length, "chapter")} approved</b>
      <div class="meter" style="width:180px;margin-top:6px"><i style="width:${cs.length ? (approved / cs.length) * 100 : 0}%"></i></div></div>
    <div class="row">
      ${run.status === "running" ? '<span class="pill good">drafting</span>' : ""}
      <span class="pill">${(() => { const t = cs.reduce((n, c) => n + (c.wordCount || 0), 0); return plural(t, "word", null, t.toLocaleString()); })()}</span>
    </div>
  </div>

  <div class="card" style="padding:0">
    ${cs.map((c) => `<div class="chap">
      <div class="num">${c.number}</div>
      <div><div class="t">${esc(c.title)}</div>
        <div class="s">${esc(c.synopsis || "")}</div>
        ${c.issues?.length ? `<div class="s" style="color:var(--warn);margin-top:3px">${esc(c.issues[0])}${
          c.issues.length > 1 ? ` (+${c.issues.length - 1} more)` : ""}</div>` : ""}</div>
      <div class="row">
        ${c.styleFidelity !== undefined
          ? `<span class="pill ${fidelityClass(c.styleFidelity)}">style ${c.styleFidelity}</span>` : ""}
        ${c.flowVerdict ? `<span class="pill ${c.flowVerdict === "pass" ? "good" : c.flowVerdict === "revise" ? "warn" : "bad"}">flow ${esc(c.flowVerdict)}</span>` : ""}
        <span class="pill ${c.status === "approved" ? "good" : c.status === "needs_work" ? "bad" : ""}">${esc(c.status)}</span>
        ${c.status === "validated" ? `<button class="sm" onclick="setStatus(${c.number},'approved')">Approve</button>` : ""}
      </div>
    </div>`).join("")}
  </div>

  ${directionsCard(pending, dirs)}`;
}

/** The author's channel to the drafting agent. */
function directionsCard(pending, all) {
  const applied = all.filter((d) => d.appliedAt);
  return `
  <div class="card" style="margin-top:14px">
    <label>Instructions for the writing</label>
    <div class="hint" style="margin-bottom:8px">Anything you want taken into account from here on: a
    change of direction, a note about a character, something to stop doing. The drafting agent reads these
    before each chapter and marks them applied.</div>
    <textarea id="direction" rows="3" placeholder="Keep Mara's chapters colder. Stop explaining the seal in dialogue."></textarea>
    <div class="row" style="margin-top:8px">
      <button onclick="addDirection(this)">Add instruction</button>
      <select id="dirscope" style="width:auto">
        <option value="book">From now on</option>
        <option value="chapter">Next chapter only</option>
      </select>
    </div>

    ${pending.length ? `<div style="margin-top:14px">
      <b style="font-size:12.5px">Waiting to be applied</b>
      ${pending.map((d) => `<div class="dir">
        <div>${esc(d.text)}</div>
        <div class="dir-m">${d.scope === "chapter" ? "next chapter only" : "from now on"} · ${new Date(d.createdAt).toLocaleString()}</div>
        <button class="doc-x" title="Remove" onclick="removeDirection('${d.id}')">✕</button>
      </div>`).join("")}
    </div>` : ""}

    ${applied.length ? `<div style="margin-top:14px">
      <b style="font-size:12.5px;color:var(--faint)">Applied (${applied.length})</b>
      ${applied.slice(-4).map((d) => `<div class="dir applied">
        <div>${esc(d.text)}</div>
        <div class="dir-m">applied${d.appliedTo ? ` at chapter ${d.appliedTo}` : ""} · ${new Date(d.appliedAt).toLocaleString()}</div>
      </div>`).join("")}
    </div>` : ""}
  </div>`;
}

async function addDirection(btn) {
  const box = document.getElementById("direction");
  const text = box?.value?.trim();
  if (!text) { toast("Write the instruction first.", "warn"); return; }
  const scope = document.getElementById("dirscope")?.value || "book";

  btn.disabled = true;
  try {
    const r = await api("/api/directions", { method: "POST", body: { text, scope } });
    S = r.state; if (box) box.value = "";
    render();
    toast("Instruction added. It will be applied before the next chapter.");
  } catch (e) { toast(e.message, "error"); }
  finally { btn.disabled = false; }
}

async function removeDirection(id) {
  try { S = await api(`/api/directions/${id}`, { method: "DELETE" }); render(); toast("Instruction removed."); }
  catch (e) { toast(e.message, "error"); }
}

async function resumeRun(btn) {
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Checking credentials…';
  try {
    const r = await api("/api/run/resume", { method: "POST" });
    S = r.state; render();
    toast(r.resumeAt ? `Resuming at chapter ${r.resumeAt}.` : "Resumed.");
  } catch (e) {
    // A 409 carries why it refused to resume, which is more useful than the status.
    toast(e.message, "error");
    btn.disabled = false; btn.textContent = "Resume";
  }
}

async function setStatus(number, status) {
  try { S = await api(`/api/chapters/${number}/status`, { method: "POST", body: { status } }); render(); }
  catch (e) { toast(e.message, "error"); }
}

// --- boot ------------------------------------------------------------------
(async function () {
  await reload();
  loadVersion(false);
  // A remote check is a network round trip, so it runs rarely.
  loadVersion(true);
  setInterval(() => loadVersion(true), 10 * 60 * 1000);
  if (S) {
    const persistedRoute = { preparation: "style", preflight: "questions", writing: "chapters",
      review: "chapters", export: "chapters", complete: "chapters" }[S.phase] || S.phase;
    route = PHASES.some((p) => p.id === persistedRoute) ? persistedRoute : "connect";
    render();
    if (route === "sources") loadBrowse("root");
    if (route === "engine") loadEngine();
    if (route === "connect") loadDrive();
    if (route === "draft" && S.manuscript) loadDraftAnalysis();
    if (route === "style" && S.styleCorpus.built) loadFingerprint();
    if (route === "questions") loadQuestions();
  }
})();
</script>
</body>
</html>
