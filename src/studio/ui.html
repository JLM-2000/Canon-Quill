        ${preparationRerunScopeHtml(noted)}
        <p class="hint">This run repairs preparation only and stops before prose drafting.</p>`
      : `<div class="info warn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg><div><b>No document notes are saved</b><p>There is no document-specific repair to apply right now.</p></div></div>
        <p>If something needs changing, write a general preparation instruction below. Canon Quill will use it to identify the documents that need attention and leave unrelated documents alone.</p>
        <label>General preparation instruction</label>
        <textarea id="prep-rerun-general-note" rows="5" placeholder="Recheck the causality between the central conflict and the chapter plan. Preserve the character voice and all approved decisions."></textarea>
        <div class="hint">This instruction is for this repair run only. It will not be saved as a document note.</div>`,
    actions: `<button data-rerun="${hasNotes}" data-require-note="${!hasNotes}" data-start-label="${hasNotes ? "Reprepare affected documents" : "Start preparation repair"}" onclick="startPreparationRun(this)">${hasNotes ? "Reprepare affected documents" : "Start preparation repair"}</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>`
  });
}

const PREPARATION_DEPENDENCIES = {
  "project-brief.md": ["book-bible.md", "plot-bible.md", "chapter-plan.md", "validation-rubric.md", "preparation-manifest.json"],
  "book-bible.md": ["plot-bible.md", "chapter-plan.md", "validation-rubric.md", "preparation-manifest.json"],
  "character-bible.md": ["book-bible.md", "plot-bible.md", "chapter-plan.md", "validation-rubric.md", "preparation-manifest.json"],
  "world-bible.md": ["book-bible.md", "plot-bible.md", "chapter-plan.md", "validation-rubric.md", "preparation-manifest.json"],
  "plot-bible.md": ["chapter-plan.md", "validation-rubric.md", "preparation-manifest.json"],
  "style-guide.md": ["chapter-plan.md", "validation-rubric.md", "preparation-manifest.json"],
  "chapter-plan.md": ["validation-rubric.md", "preparation-manifest.json"],
  "validation-rubric.md": ["preparation-manifest.json"],
  "preparation-manifest.json": []
};

function preparationDocumentNames() {
  return PREP_DOCS?.map((doc) => doc.name)
    || [...new Set([...(PREPARATION?.present || []), ...(PREPARATION?.missing || [])])];
}

function preparationAffectedDocuments(selected) {
  const affected = new Set();
  for (const name of selected) for (const dependent of PREPARATION_DEPENDENCIES[name] || []) affected.add(dependent);
  return [...affected].filter((name) => !selected.includes(name));
}

function preparationRerunScopeHtml(noted, selected = noted) {
  const selectedSet = new Set(selected);
  const affected = preparationAffectedDocuments(selected);
  const allNames = preparationDocumentNames();
  const deferred = noted.filter((name) => !selectedSet.has(name));
  const preserved = allNames.filter((name) => !noted.includes(name) && !affected.includes(name));
  const notes = noted.length
    ? `<div><b>Documents with saved notes</b><div id="prep-rerun-documents" class="prep-rerun-list">${noted.map((name) => `<label class="prep-rerun-item"><input type="checkbox" value="${esc(name)}" ${selectedSet.has(name) ? "checked" : ""} onchange="refreshPreparationRerunScope()"><span><b>${esc(name)}</b><span>Apply this note in the current repair</span></span></label>`).join("")}</div></div>`
    : `<div class="hint">No document notes are saved. Only missing preparation documents would be created.</div>`;
  return `<div id="prep-rerun-scope" class="prep-status">
    ${notes}
    ${affected.length ? `<div style="margin-top:12px"><b>Related documents checked automatically</b><ul>${affected.map((name) => `<li>${esc(name)}</li>`).join("")}</ul></div>` : ""}
    ${deferred.length ? `<div style="margin-top:12px"><b>Saved notes for a later run</b><ul>${deferred.map((name) => `<li>${esc(name)}</li>`).join("")}</ul></div>` : ""}
    ${preserved.length ? `<div style="margin-top:12px"><b>Not part of this repair</b><ul>${preserved.map((name) => `<li>${esc(name)}</li>`).join("")}</ul></div>` : ""}
  </div>`;
}

function refreshPreparationRerunScope() {
  const selected = [...document.querySelectorAll("#prep-rerun-documents input:checked")].map((input) => input.value);
  const noted = [...document.querySelectorAll("#prep-rerun-documents input")].map((input) => input.value);
  const scope = document.getElementById("prep-rerun-scope");
  if (scope) scope.outerHTML = preparationRerunScopeHtml(noted, selected);
}

async function savePreparationNote(index, name, btn) {
  const note = document.getElementById(`prep-note-${index}`)?.value || "";
  btn.disabled = true;
  try {
    S = await api(`/api/preparation/documents/${encodeURIComponent(name)}`, { method: "PATCH", body: { note } });
    if (PREP_DOCS[index]) PREP_DOCS[index].note = note;
    PREPARATION.reviewed = false;
    render();
    toast(note.trim() ? "Note saved for the preparation run." : "Note cleared.");
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

async function continuePreparationReview(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/preparation/review", { method: "POST" });
    S = await api("/api/writing/confirm", { method: "POST" });
    collapsedGroups["Set up"] = true;
    collapsedGroups.Prepare = true;
    route = "chapters";
    render();
    startChapterPolling();
    loadRuntime();
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

function viewChapters() {
  const cs = S.chapters || [];
  const mode = S.draftingMode;
  const run = S.run || {};
  const dirs = S.directions || [];
  const pending = dirs.filter((d) => !d.appliedAt);

  const HALTS = {
    no_credit: ["Out of credit", "The provider accepted the credentials but there is nothing left to spend. Add credit or raise the billing limit, then resume."],
    rate_limited: ["Session or usage limit reached", "The writing session reached a provider limit. Wait for the session or plan limit to reset, then resume. Your saved work is safe."],
    invalid_credentials: ["Credentials rejected", "The key or sign-in was refused. It may have been revoked, deleted or replaced. Fix it under Writing engine, then resume."],
    provider_error: ["The provider failed", "Something went wrong on their side. Usually worth resuming after a moment."],
    stalled: ["Runtime stalled", "The orchestrator stopped responding after delegated agent activity. The run was stopped automatically; resume to restore its saved provider conversation."],
    cancelled: ["Stopped by you", "Resume whenever you are ready."],
    other: ["Drafting stopped", "The run did not finish."]
  };

  const haltCard = run.status === "halted" ? (() => {
    const preparationHalt = run.role === "analysis";
    const sessionLimit = run.reason === "rate_limited" && /session limit|hit your session/i.test(run.detail || "");
    const preparationHalts = {
      no_credit: ["Preparation stopped: out of credit", "The preparation provider accepted the credentials but has no credit left. Add credit or raise the billing limit, then resume preparation."],
      rate_limited: ["Preparation session limit reached", "The preparation session reached a provider limit. Wait for it to reset, then resume preparation."],
      invalid_credentials: ["Preparation credentials rejected", "Fix the selected preparation provider under Writing engine, then resume preparation."],
      provider_error: ["Preparation provider failed", "The preparation provider stopped unexpectedly. Resume preparation when it is available again."],
      stalled: ["Preparation runtime stalled", "The orchestrator stopped responding after delegated reference extraction. The run was stopped automatically; resume preparation to restore its saved provider conversation."],
      cancelled: ["Preparation stopped", "Resume preparation whenever you are ready."],
      other: ["Preparation stopped", "Preparation did not finish. The documents already written are still available to read."]
    };
    const [title, help] = sessionLimit
      ? preparationHalt
        ? ["Preparation session limit reached", "The preparation session reached its usage limit. Wait for it to reset, then resume preparation."]
        : ["Session limit reached", "The writing session reached its usage limit. Wait for it to reset, then resume. Your saved work is safe."]
      : preparationHalt ? preparationHalts[run.reason] || preparationHalts.other : HALTS[run.reason] || HALTS.other;
    return `<div class="card" style="border-color:var(--bad)">
      <div class="row" style="margin-bottom:6px">
        <b style="color:var(--bad)">${title}</b>
        ${!preparationHalt && run.chapter ? `<span class="pill">stopped on chapter ${run.chapter}</span>` : ""}
        ${run.haltedAt ? `<span class="pill">${new Date(run.haltedAt).toLocaleString()}</span>` : ""}
      </div>
      <p class="sub" style="margin:0 0 8px">${help}</p>
      ${run.detail ? `<div class="steplog">${esc(run.detail)}</div>` : ""}
      <p class="hint" style="margin:10px 0 0">${preparationHalt
         ? "Everything prepared so far is kept. Resume restores the saved provider conversation when available and continues from the saved package."
         : "Everything written so far is kept. Resume restores the saved provider conversation when available and continues at the first chapter that is not approved, using the saved workspace as its authority."}</p>
      <div class="row" style="margin-top:12px">
         <button onclick="resumeRunModal()">${preparationHalt ? "Resume preparation" : "Resume"}</button>
        ${["invalid_credentials", "no_credit", "rate_limited"].includes(run.reason)
          ? '<button class="ghost" onclick="go(\'engine\')">Check writing engine</button>' : ""}
      </div>
    </div>`;
  })() : "";

  const live = run.status === "running";
  // A halted run offers Resume, which is the same act as starting.
  const packageReviewed = Boolean(PREPARATION?.ready && S.preparationReviewed);
  const preparationReadyForReview = run.status !== "running" && Boolean(PREPARATION?.ready && !S.preparationReviewed);
  const nextChapter = cs.find((chapter) => chapter.status !== "approved")?.number ?? null;
  const writingCard = preparationReadyForReview ? preparationReviewCard() : live ? runPanel(run) : haltCard ? "" : packageReviewed ? startCard(cs.length > 0, mode, nextChapter) : preparationCard();
  // A file can appear before the orchestrator has finished its writing and
  // editing passes. Keep it out of the author-facing output until the run ends.
  const finishedOutput = run.status === "running" ? "" : outputCard();

  if (!cs.length) {
    if (route === "preparation") return `<h1>Preparation</h1>
      ${haltCard}
      ${haltCard || live ? "" : '<p class="sub">The package is built before a chapter plan is opened. Review it below when it is ready.</p>'}
      ${packageReviewed ? directionsCard(pending, dirs) : ""}
      ${writingCard}
      ${finishedOutput}`;
    return `${haltCard}
      ${packageReviewed ? directionsCard(pending, dirs) : ""}
      ${writingCard}
      ${finishedOutput}`;
  }

  return `
  ${haltCard}
  ${packageReviewed ? directionsCard(pending, dirs) : ""}

  ${S.writingConfirmed ? "" : `<div class="card" style="border-color:var(--accent)">
    <b>The chapter plan changed</b>
    <p class="sub" style="margin:6px 0 12px">A plan of ${plural(cs.length, "chapter")} is waiting on you. Read it
    below, then confirm it as the contract the writing is held to.</p>
    <button onclick="continueToChapters(this)">Confirm the plan</button>
  </div>`}

  ${writingCard}
  ${finishedOutput}

  ${chapterChat ? chapterChatCard(chapterChat) : ""}
  `;
}

function chapterChatCard(chat) {
  return `<div class="card" style="margin-top:14px;border-color:var(--accent)">
    <div class="spread"><div><b>Chapter ${chat.number} planning chat</b><div class="hint">Tell the drafting agent what must happen, what matters, which dialogue or emotional turns to protect, and what to avoid.</div></div>
      <button class="ghost sm" onclick="chapterChat=null;render()">Close</button></div>
    <div class="chatlog" style="margin-top:12px;max-height:300px;overflow:auto">
      ${chat.messages.length ? chat.messages.map((message) => `<div class="chat ${message.role === "author" ? "author" : "agent"}"><b>${message.role === "author" ? "You" : "Agent"}</b><div>${esc(message.text)}</div></div>`).join("") : '<div class="hint">No chapter guidance yet.</div>'}
    </div>
    <div class="row" style="margin-top:10px"><textarea id="chapter-chat-input" rows="3" placeholder="The chapter must... Include this dialogue beat... Do not reveal..."></textarea>
      <button onclick="sendChapterChat(this,${chat.number})">Send</button></div>
  </div>`;
}

function redoChapterModal(number) {
  showModal({
    title: `Redo Chapter ${number}`,
    body: `<p>Write what should change. Canon Quill will keep the chapter's place in the plan and send this instruction with the next drafting run.</p>
      <textarea id="redo-note" rows="5" placeholder="Make the emotional turn quieter. Remove the explanation in the final dialogue. Keep the ending beat."></textarea>`,
    actions: `<button onclick="redoChapter(${number}, this)">Save and redo</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>`
  });
}

async function redoChapter(number, btn) {
  const note = document.getElementById("redo-note")?.value?.trim();
  if (!note) { toast("Write what should change first.", "warn"); return; }
  btn.disabled = true;
  try {
    const direction = await api("/api/directions", { method: "POST", body: { text: note, scope: "chapter", chapter: number } });
    S = await api(`/api/chapters/${number}/status`, { method: "POST", body: { status: "needs_work" } });
    closeModal();
    render();
    toast("Chapter marked for redo with your instructions.");
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

async function openChapterChat(number) {
  chapterChat = { number, messages: [] };
  render();
  try {
    chapterChat.messages = (await api(`/api/chapters/${number}/chat`)).messages || [];
    render();
  } catch (e) { toast(e.message, "error"); }
}

async function sendChapterChat(btn, number) {
  const input = document.getElementById("chapter-chat-input");
  const text = input?.value?.trim();
  if (!text) { toast("Write the chapter guidance first.", "warn"); return; }
  btn.disabled = true;
  try {
    const result = await api(`/api/chapters/${number}/chat`, { method: "POST", body: { text } });
    chapterChat = { number, messages: result.messages || [] };
    render();
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

/** The author's channel to the drafting agent. */
function directionsCard(pending, all) {
  const applied = all.filter((d) => d.appliedAt);
  return `
  <div class="card" style="margin-top:14px">
    <div class="spread">
       <div><b>Instructions</b>
        <div class="hint" style="margin-top:3px">Saved instructions appear here and are read before the next writing run.</div></div>
      <button class="ghost sm" onclick="addDirectionModal()">Add instruction</button>
    </div>

    ${pending.length ? `<div style="margin-top:14px">
      <b style="font-size:12.5px">Saved for the next run</b>
      ${pending.map((d) => `<div class="dir">
        <div>${esc(d.text)}</div>
        <div class="dir-m">${d.scope === "chapter" ? "next chapter only" : "from now on"} · ${new Date(d.createdAt).toLocaleString()}</div>
        <div class="dir-actions"><button class="ghost icon-button" title="Edit instruction" aria-label="Edit instruction" onclick="editDirectionModal('${d.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 20 4.5-1 10.8-10.8a2.1 2.1 0 0 0-3-3L5.5 16z"/><path d="m14.5 6.5 3 3"/></svg></button>
          <button class="doc-x" title="Delete instruction" aria-label="Delete instruction" onclick="removeDirection('${d.id}')">✕</button></div>
      </div>`).join("")}
    </div>` : ""}

    ${applied.length ? `<div style="margin-top:14px">
      <b style="font-size:12.5px;color:var(--faint)">Already applied (${applied.length})</b>
      ${applied.slice(-4).map((d) => `<div class="dir applied">
        <div>${esc(d.text)}</div>
        <div class="dir-m">applied${d.appliedTo ? ` at chapter ${d.appliedTo}` : ""} · ${new Date(d.appliedAt).toLocaleString()}</div>
      </div>`).join("")}
    </div>` : !pending.length ? '<div class="hint" style="margin-top:12px">No saved instructions yet.</div>' : ""}
  </div>`;
}

function addDirectionModal() {
  showModal({
    title: "Add writing instruction",
    body: `<p class="hint">Save a note for the drafting agent. It will appear in the instruction list and remain there until applied or removed.</p>
      <textarea id="direction" rows="4" placeholder="Keep the protagonist's chapters colder. Stop explaining the central mystery in dialogue."></textarea>
      <label style="margin-top:12px">Applies</label>
      <select id="dirscope">
        <option value="book">From now on</option>
        <option value="chapter">Next chapter only</option>
      </select>`,
    actions: `<button onclick="addDirection(this)">Save instruction</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>`
  });
}

async function addDirection(btn) {
  const box = document.getElementById("direction");
  const text = box?.value?.trim();
  if (!text) { toast("Write the instruction first.", "warn"); return; }
  const scope = document.getElementById("dirscope")?.value || "book";

  btn.disabled = true;
  try {
    const r = await api("/api/directions", { method: "POST", body: { text, scope } });
    S = r.state;
    closeModal();
    render();
    toast("Instruction added. It will be applied before the next chapter.");
  } catch (e) { toast(e.message, "error"); }
  finally { btn.disabled = false; }
}

function editDirectionModal(id) {
  const direction = (S.directions || []).find((item) => item.id === id);
  if (!direction || direction.appliedAt) return;
  showModal({
    title: "Edit writing instruction",
    body: `<textarea id="direction-edit" rows="4">${esc(direction.text)}</textarea>
      <label style="margin-top:12px">Applies</label>
      <select id="dirscope-edit">
        <option value="book" ${direction.scope === "book" ? "selected" : ""}>From now on</option>
        <option value="chapter" ${direction.scope === "chapter" ? "selected" : ""}>Next chapter only</option>
      </select>`,
    actions: `<button onclick="saveDirectionEdit('${id}', this)">Save changes</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>`
  });
}

async function saveDirectionEdit(id, btn) {
  const text = document.getElementById("direction-edit")?.value?.trim();
  if (!text) { toast("Write the instruction first.", "warn"); return; }
  const scope = document.getElementById("dirscope-edit")?.value || "book";
  btn.disabled = true;
  try {
    const r = await api(`/api/directions/${id}`, { method: "PATCH", body: { text, scope } });
    S = r.state;
    closeModal();
    render();
    toast("Instruction updated.");
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

async function removeDirection(id) {
  try { S = await api(`/api/directions/${id}`, { method: "DELETE" }); render(); toast("Instruction removed."); }
  catch (e) { toast(e.message, "error"); }
}

async function resumeRunModal() {
  try {
    const status = await api("/api/preparation/status");
    const preparationRun = S.run?.role === "analysis" && !S.preparationReviewed;
    if (!preparationRun && (!status.ready || !S.preparationReviewed)) {
      showPreparationRequired(status);
      return;
    }
    if (!preparationRun) {
      try { WRITING_ESTIMATE = await api("/api/run/estimate"); }
      catch { WRITING_ESTIMATE = null; }
    }
    showModal({
      title: preparationRun ? "Resume preparation?" : "Resume writing?",
      body: `<p class="hint">This restores the saved provider conversation when available. It also reads the saved workspace, decisions, artifacts, and recorded runtime conversation before continuing. If the provider cannot restore its session, the saved workspace remains the authority.</p>
        ${preparationChecklist(status)}
        ${preparationRun ? '<p class="hint">Preparation will continue building the missing documents and stop again before prose drafting.</p>' : writingEstimateCard(WRITING_ESTIMATE)}`,
      actions: `<button onclick="resumeRun(this)">${preparationRun ? "Resume preparation" : "Resume writing"}</button>
        <button class="ghost" onclick="closeModal()">Not yet</button>`
    });
  } catch (e) { toast(e.message, "error"); }
}

async function resumeRun(btn) {
  const preparationRun = S.run?.role === "analysis" && !S.preparationReviewed;
  const draftingAuth = S.engine?.draftingAuthMethod ?? S.engine?.authMethod;
  const label = preparationRun ? "Resuming preparation…" : draftingAuth === "api_key" ? "Checking credentials and starting…" : "Starting writing…";
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span> ${label}`;
  try {
    const r = await api("/api/run/resume", { method: "POST" });
    S = r.state;
    closeModal();
    runEvents = [];
    runAgents = [];
    selectedRunAgent = "orchestrator";
    runLatest = 0;
    runProgress = null;
    resetRunProgressDisplay();
    runOutput = null;
    resetDismissedOutputAlerts();
    render();
    startRunPolling();
    toast(r.resumeAt ? `Resuming at chapter ${r.resumeAt}.` : "Resumed.");
  } catch (e) {
    // A 409 carries why it refused to resume, which is more useful than the status.
    if (/^Preparation is not ready\./.test(e.message)) {
      try { showPreparationRequired(await api("/api/preparation/status")); }
      catch { toast(e.message, "error"); }
    } else {
      toast(e.message, "error");
    }
    btn.disabled = false; btn.textContent = "Resume";
  }
}

async function setStatus(number, status) {
  try { S = await api(`/api/chapters/${number}/status`, { method: "POST", body: { status } }); render(); }
  catch (e) { toast(e.message, "error"); }
}

// --- boot ------------------------------------------------------------------
(async function () {
  await reload();
  loadVersion(false);
  // A remote check is a network round trip, so it runs rarely.
  loadVersion(true);
  setInterval(() => loadVersion(true), 10 * 60 * 1000);
  if (S) {
     const persistedRoute = { preparation: S.writingConfirmed ? "chapters" : S.conversationStartedAt ? "preparation" : "style", intake_analysis: "intake_analysis", preflight: "questions", writing: "chapters",
      review: "chapters", export: "chapters", complete: "chapters" }[S.phase] || S.phase;
    route = PHASES.some((p) => p.id === persistedRoute) ? persistedRoute : "connect";
    render();
    if (route === "sources" && (S.drive.connected || !(S.sources || []).some((source) => source.driveId.startsWith("local-")))) loadBrowse("root");
    if (route === "engine") loadEngine();
    if (route === "connect") loadDrive();
    if (route === "style" && S.styleCorpus.built) loadFingerprint();
     if (route === "questions") { loadQuestions(); startQuestionPolling(); }
     if (route === "preparation") enterPreparation();
     if (route === "chapters") enterChapters();
  }
})();
</script>
</body>
