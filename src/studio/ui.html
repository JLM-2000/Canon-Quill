<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canon Quill Studio</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%237aa2f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C11 5 7 10 6 16l-2 4"/><path d="M13 5c3 3 4 7 3 11-3 1-7 0-10-3"/></svg>' />
<style>
  :root {
    --bg: #0e1116;
    --surface: #151a22;
    --surface-2: #1c222c;
    --border: #2a323f;
    --text: #e6eaf0;
    --muted: #97a3b6;
    --faint: #6b7688;
    --accent: #7aa2f7;
    --accent-dim: #2a3a5c;
    --good: #7bd88f;
    --warn: #e5c07b;
    --bad: #f07178;
    --sidebar-width: 232px;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dde1e8;
      --text: #16191f; --muted: #5c6675; --faint: #8b95a5; --accent: #3355cc;
      --accent-dim: #dce4fb; --good: #1a7f3c; --warn: #8a6416; --bad: #c0392b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }

  /* --- sidebar --- */
  aside {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 18px 12px; display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; width: var(--sidebar-width); min-width: var(--sidebar-width); height: 100vh;
    overflow-y: auto; scrollbar-gutter: stable;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 14px; }
  .brand b { font-size: 15px; letter-spacing: -0.01em; }
  .brand span { color: var(--faint); font-size: 11px; display: block; font-weight: 400; }
  .quill { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .navitem {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; color: var(--muted); border: none;
    background: none; width: 100%; text-align: left; font: inherit;
  }
  .navitem:hover { background: var(--surface-2); color: var(--text); }
  .navitem.active { background: var(--accent-dim); color: var(--text); font-weight: 600; }
  .navitem .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex: none; }
  .navitem.done .dot { background: var(--good); }
  .navitem.current .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .navitem.locked { opacity: .42; cursor: not-allowed; }
  .navitem.locked:hover { background: none; color: var(--muted); }
  .navitem .lock { margin-left: auto; width: 11px; height: 11px; color: var(--faint); flex: none; }
  .navitem .badge {
    margin-left: auto; background: var(--bad); color: #fff; font-size: 10px;
    font-weight: 700; padding: 1px 6px; border-radius: 999px;
  }
  .navgroup { color: var(--faint); font-size: 10px; text-transform: uppercase;
    letter-spacing: .08em; padding: 14px 10px 5px; font-weight: 700; }
  .navgroup-toggle { display:flex; justify-content:space-between; align-items:center; width:100%;
    border:0; background:none; font:inherit; cursor:pointer; text-align:left; }
  .navgroup-toggle:hover { color:var(--text); }

  /* --- main --- */
  main { min-width: 0; width: 100%; padding: 26px 32px 80px; max-width: 1080px; }
  .verline { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .ver { color: var(--faint); font-size: 10.5px; font-family: var(--mono); }
  .newver { width: 15px; height: 15px; border-radius: 50%; border: none; cursor: pointer;
    font-size: 10px; font-weight: 700; line-height: 15px; padding: 0; color: #fff;
    display: inline-flex; align-items: center; justify-content: center; }
  .newver:hover { filter: brightness(1.15); }
  .newver.attn { background: var(--warn); color: #1a1205; }
  .newver.up { background: var(--accent); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: flex;
    align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    max-width: 640px; width: 100%; max-height: 82vh; overflow-y: auto; padding: 20px; }
  .modal.document-modal { max-width: min(1180px, 96vw); max-height: 94vh; padding: 24px 28px; }
  .modal.writing-modal { max-width: min(820px, 96vw); max-height: none; overflow: visible; padding: 24px 28px; }
  .modal.writing-modal .estimate { margin: 8px 0; padding: 10px; }
  .modal.writing-modal .estimate h4 { margin-bottom: 5px; }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .commit { border-left: 2px solid var(--border); padding: 4px 0 4px 10px; margin: 6px 0; font-size: 12.5px; }
  .commit code { font-size: 11px; }
  .steplog { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px;
    font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-word;
    max-height: 180px; overflow-y: auto; margin-top: 6px; }
  h1 { font-size: 21px; margin: 0 0 3px; letter-spacing: -0.02em; }
  h2 { font-size: 15px; margin: 26px 0 10px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 22px; max-width: 68ch; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .compact-select { width: auto; min-width: 160px; max-width: 250px; }
  .intake-fields { display: flex; gap: 12px; flex-wrap: wrap; }
  .intake-field { flex: 0 1 250px; min-width: 180px; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  button, .btn {
    background: var(--accent); color: #fff; border: none; padding: 8px 14px;
    border-radius: 7px; cursor: pointer; font: inherit; font-weight: 600;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  button.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  button.text-link { background: none; color: var(--accent); padding: 0; font-size: inherit; font-weight: 600; }
  button.sm { padding: 4px 9px; font-size: 12px; }
  .file-button { display:inline-flex; align-items:center; width:auto; margin:0; padding:8px 14px;
    border-radius:7px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); cursor:pointer; }
  .file-button:hover { border-color:var(--accent); }
  input, textarea, select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 7px; font: inherit; width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
  label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 12.5px; }
  label.opt { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; }
  label.opt input { width: auto; margin: 0; }
  .hint { color: var(--faint); font-size: 12px; margin-top: 4px; }

  .runlog { background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    height: 320px; max-height: 320px; overflow: hidden; padding: 8px 10px; font-size: 12.5px; }
  .runline { display: flex; gap: 8px; padding: 2px 0; color: var(--muted); }
  .runline .t { color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
  .runline.step { color: var(--muted); }
  .runline.system { color: var(--accent); }
  .runline.error { color: var(--bad); }
  .run-console-layout { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 8px; height: 100%; min-height: 0; }
  .run-agent-nav { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px; overflow-y: auto; min-height: 0; }
  .run-agent-nav button { display: flex; align-items: center; gap: 7px; width: 100%; padding: 7px 8px; padding-left: calc(8px + var(--agent-depth, 0) * 14px); text-align: left; background: transparent; color: var(--muted); font-size: 12px; }
  .run-agent-nav button:hover, .run-agent-nav button.active { background: var(--bg); color: var(--text); }
  .run-agent-nav .agent-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-agent-nav .agent-kind { display: block; color: var(--faint); font-size: 10px; margin-top: 1px; }
  .agent-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--good) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 15%, transparent); }
  .agent-dot.working { background: var(--good) !important; }
  .agent-dot.waiting { background: #4f8cff !important; box-shadow: 0 0 0 3px color-mix(in srgb, #4f8cff 18%, transparent); }
  .agent-dot.done { background: #4b5563 !important; box-shadow: none; }
  .run-agent-view { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .run-agent-view-head { display: flex; align-items: baseline; gap: 8px; padding: 7px 9px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .run-agent-view-head .agent-kind { color: var(--faint); font-size: 11px; }
  .run-agent-view .run-agent-thread { flex: 1; min-height: 0; overflow-y: auto; padding: 5px 9px; }
  @media (max-width: 600px) { .run-console-layout { grid-template-columns: 1fr; } .run-agent-nav { display: flex; gap: 4px; overflow-x: auto; } .run-agent-nav button { min-width: 150px; } }
  .run-status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 15%, transparent); }
  .run-status-dot.waiting { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
  .run-status-dot.stopped { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 15%, transparent); }
  .run-progress { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .run-progress-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .run-progress-head b { font-size: 13px; }
  .run-progress-head span { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .run-progress .meter { width: 100%; height: 6px; margin-top: 9px; }
  .run-progress .meter i { background: var(--accent); transition: none; }
  .run-progress-detail { color: var(--muted); font-size: 12px; margin-top: 7px; }
  .estimate { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 12px 0; }
  .estimate h4 { margin: 0 0 8px; font-size: 12.5px; }
  .estimate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .estimate-grid div { background: var(--bg); border-radius: 6px; padding: 8px 9px; }
  .estimate-grid b { display: block; font-size: 15px; }
  .estimate-grid span { color: var(--muted); font-size: 11px; }
  .estimate .hint { margin-top: 9px; }
  .output-preview { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 12px;
    max-height: 420px; overflow: auto; white-space: pre-wrap; font-family: var(--serif, Georgia, serif);
    font-size: 13px; line-height: 1.65; }
  .output-preview.truncated { max-height: 260px; }
  a.btn { display: inline-block; text-decoration: none; }
  .download-menu { position: relative; }
  .download-menu summary { list-style: none; cursor: pointer; }
  .download-menu summary::-webkit-details-marker { display: none; }
  .download-options { position: absolute; right: 0; z-index: 4; min-width: 118px; margin-top: 4px;
    padding: 5px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface);
    box-shadow: 0 10px 24px rgba(0,0,0,.15); }
  .download-options a { display: block; padding: 7px 9px; white-space: nowrap; color: var(--text); text-decoration: none; font-size: 12px; }
  .download-options a:hover { background: var(--surface-2); }
  .analysis-finding { min-height: 76px; resize: vertical; }

  #view.readonly .choice, #view.readonly .chip, #view.readonly .doc-x,
  #view.readonly .fs .item, #view.readonly .crumbs button { pointer-events: none; opacity: 0.7; }
  #view.readonly input:disabled, #view.readonly textarea:disabled,
  #view.readonly select:disabled { opacity: 0.7; cursor: default; }

  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); font-weight: 600; white-space: nowrap; }
  .pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.bad  { background: color-mix(in srgb, var(--bad) 18%, transparent);  color: var(--bad); }

  /* choice cards */
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .choice {
    border: 1.5px solid var(--border); background: var(--surface); border-radius: var(--radius);
    padding: 14px; cursor: pointer; transition: border-color .12s, background .12s;
  }
  .choice:hover { border-color: var(--accent); }
  .choice.locked { cursor: default; pointer-events: none; }
  .choice.locked:hover { border-color: var(--accent); }
  .choice.on { border-color: var(--accent); background: var(--accent-dim); }
  .choice b { display: block; margin-bottom: 3px; }
  .choice p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .series-order { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .series-order .item { display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    border-bottom: 1px solid var(--border); background: var(--surface); }
  .series-order .item:last-child { border-bottom: none; }
  .series-order .item:hover { background: var(--surface-2); }
  .series-order .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drag-handle { color: var(--faint); cursor: grab; letter-spacing: -2px; user-select: none; }
  .prep-doc { border: 1px solid var(--border); border-radius: var(--radius); margin-top: 8px; overflow: hidden; }
  .prep-doc summary { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; padding: 11px 12px; background: var(--surface-2); }
  .prep-doc summary::marker { color: var(--accent); }
  .prep-doc pre { max-height: 420px; overflow: auto; margin: 0; padding: 14px; white-space: pre-wrap; font: 12px/1.6 var(--mono); color: var(--muted); background: var(--bg); }
  .prep-doc label, .prep-doc textarea { margin: 10px 12px 0; width: calc(100% - 24px); box-sizing: border-box; }
  .prep-doc textarea { margin-bottom: 0; }
  .prep-doc .row { padding: 0 12px 12px; }
  .prep-note-editor { display: flex; align-items: flex-end; gap: 8px; margin-top: 8px; }
  .prep-note-editor textarea { flex: 1; min-width: 0; width: auto; margin: 0; box-sizing: border-box; }
  .prep-note-editor button { flex: none; white-space: nowrap; }
  .prep-status { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; margin: 10px 0; }
  .prep-status-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .prep-status-head code { color: var(--faint); font: 11px var(--mono); }
  .prep-status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 9px; }
  .prep-status-grid > div { background: var(--bg); border-radius: 6px; padding: 8px 10px; }
  .prep-status-grid b { font-size: 12px; }
  .prep-status-grid ul { margin: 5px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
  .prep-status-grid li + li { margin-top: 2px; }
  .prep-status-grid .done { color: var(--good); }
  .prep-status-grid .pending { color: var(--warn); }
  .prep-rerun-list { display: grid; gap: 6px; margin-top: 8px; }
  .prep-rerun-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 9px; background: var(--bg); border-radius: 6px; font-size: 12px; }
  .prep-rerun-item input { width: auto; margin: 2px 0 0; flex: none; }
  .prep-rerun-item b { display: block; }
  .prep-rerun-item span { display: block; color: var(--faint); font-size: 11px; margin-top: 1px; }
  .prep-live-docs { margin-top: 12px; }
  .prep-live-docs h3 { margin: 0 0 7px; font-size: 12.5px; }
  .prep-live-docs .items { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; }
  .prep-live-docs button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); font-size: 12px; }
  .prep-live-docs button:hover { border-color: var(--accent); }
  .prep-live-docs button span { color: var(--accent); font-size: 11px; }
  .prep-reader { max-height: 52vh; overflow: auto; margin: 12px 0; padding: 14px; white-space: pre-wrap; font: 12px/1.6 var(--mono); color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; }
  .prep-reader.prep-rendered { white-space: normal; font: 14px/1.7 var(--sans); }
  .prep-rendered h1, .prep-rendered h2, .prep-rendered h3 { color: var(--text); line-height: 1.25; }
  .prep-rendered h1 { font-size: 20px; }
  .prep-rendered h2 { font-size: 16px; margin-top: 20px; }
  .prep-rendered h3 { font-size: 14px; margin-top: 16px; }
  .prep-rendered p { margin: 0 0 12px; }
  .prep-rendered ul { margin: 0 0 12px; padding-left: 22px; }
  .prep-rendered blockquote { margin: 12px 0; padding-left: 14px; border-left: 2px solid var(--accent); color: var(--muted); }
  .prep-rendered table { width: 100%; border-collapse: collapse; margin: 14px 0 20px; font-size: 12.5px; }
  .prep-rendered th, .prep-rendered td { border: 1px solid var(--border); padding: 8px 9px; text-align: left; vertical-align: top; }
  .prep-rendered th { background: var(--surface-2); color: var(--text); }

  /* drive browser */
  .crumbs { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; font-size: 12.5px; margin-bottom: 10px; }
  .crumbs button { background: none; color: var(--accent); padding: 2px 4px; font-weight: 500; }
  .fs { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .fs .item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .fs .item:last-child { border-bottom: none; }
  .fs .item:hover { background: var(--surface-2); }
  .fs .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ico { width: 16px; height: 16px; flex: none; color: var(--faint); }
  .ico.folder { color: var(--accent); }

  /* grouping board */
  .reqs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .req { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--surface); }
  .req.ok { border-color: color-mix(in srgb, var(--good) 55%, var(--border)); }
  .req.todo { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 5%, var(--surface)); }
  .req-h { display: flex; align-items: center; gap: 7px; }
  .req.ok .req-h svg { color: var(--good); }
  .req.todo .req-h svg { color: var(--warn); }
  .req-h b { font-size: 13px; }
  .req-n { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .req p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; }
  .req.todo p { color: var(--warn); }
  .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .count { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; }
  .count b { display: block; font-size: 19px; letter-spacing: -0.02em; }
  .count span { color: var(--muted); font-size: 11.5px; }
  .count.zero b { color: var(--faint); }
  .doc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px; }
  .doc.ignored { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 5%, var(--surface)); }
  .doc-h { display: flex; align-items: flex-start; gap: 10px; }
  .doc-h > div:first-child { flex: 1; min-width: 0; }
  .doc-x { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 15px;
    line-height: 1; padding: 2px 4px; flex: none; }
  .doc-x:hover { color: var(--bad); }
  .doc-warn { color: var(--warn); font-size: 11.5px; margin-top: 7px; display: flex; gap: 5px; align-items: center; }
  .doc-h b { font-size: 13.5px; word-break: break-word; }
  .doc-m { color: var(--faint); font-size: 11.5px; margin-top: 1px; word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .col h3 { font-size: 12.5px; margin: 0 0 9px; display: flex; justify-content: space-between; align-items: center; }
  .col h3 span { color: var(--faint); font-weight: 500; }
  .src { background: var(--surface-2); border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; font-size: 12.5px; }
  .src .n { font-weight: 600; word-break: break-word; }
  .src .why { color: var(--faint); font-size: 11px; margin-top: 2px; }
  .src select { margin-top: 6px; padding: 3px 6px; font-size: 11.5px; }

  /* informational panels: never clickable, visually distinct from choices */
  .info { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .info .ic { flex: none; width: 15px; height: 15px; margin-top: 2px; color: var(--faint); }
  .info.ok .ic { color: var(--good); }
  .finished-alert { position: relative; border-color: var(--good); padding-right: 42px; }
  .finished-alert .alert-close { position: absolute; top: 7px; right: 7px; background: none; border: none; color: var(--faint); padding: 2px 6px; font-size: 18px; line-height: 1; }
  .finished-alert .alert-close:hover { color: var(--text); }
  .info.warn .ic { color: var(--warn); }
  /* Only the leading title is a block. Scoping this to every bold turned any
     emphasis inside a sentence into its own line. */
  .info > div > b:first-child { display: block; font-size: 12.5px; margin-bottom: 2px; }
  .info p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .info code { font-size: 11.5px; }
  .sectionlabel { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); font-weight: 700; margin: 22px 0 8px; }

  /* questions */
  .q { border-left: 3px solid var(--accent); }
  .q.answered { border-left-color: var(--good); opacity: .72; }
  .q .meta { color: var(--faint); font-size: 11.5px; margin-bottom: 6px; }
  .q .text { font-weight: 600; margin-bottom: 4px; font-size: 14.5px; }
  .q .why { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .opt { background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
  .opt:hover, .opt.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .answer-box { background: var(--surface-2); border-radius: 7px; padding: 8px 11px; font-size: 13px; }
  .answer-box b { color: var(--good); }

  .dir { background: var(--surface-2); border-radius: 7px; padding: 9px 11px; margin-top: 6px;
    font-size: 12.5px; position: relative; padding-right: 30px; }
  .dir.applied { opacity: .6; }
  .dir .dir-m { color: var(--faint); font-size: 11px; margin-top: 3px; }
  .dir-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 3px; }
  .icon-button { width: 27px; height: 27px; padding: 4px; display: inline-flex; align-items: center; justify-content: center; }
  .icon-button svg { width: 14px; height: 14px; }
  .dir-actions .doc-x { position: static; }

  /* chapters */
  .chap { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center;
    padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .chap:last-child { border-bottom: none; }
  .chap .num { font-family: var(--mono); color: var(--faint); font-size: 12px; text-align: right; }
  .chap .t { font-weight: 600; }
  .chap .s { color: var(--muted); font-size: 12.5px; }
  .meter { height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; width: 72px; }
  .meter i { display: block; height: 100%; background: var(--good); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--faint); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
  td.num, th.num { text-align: right; font-family: var(--mono); }

  .empty { color: var(--faint); text-align: center; padding: 34px 16px; }
  .toast-stack { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(90vw, 520px); pointer-events: none; }
  .toast {
    position: static; transform: none;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 16px 10px 13px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35); max-width: 100%;
    display: flex; gap: 9px; align-items: flex-start; border-left-width: 3px;
    pointer-events: auto;
  }
  .toast svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
  .toast.success { border-left-color: var(--good); }
  .toast.success svg { color: var(--good); }
  .toast.error { border-left-color: var(--bad); }
  .toast.error svg { color: var(--bad); }
  .toast.warn { border-left-color: var(--warn); }
  .toast.warn svg { color: var(--warn); }
  .toast.info { border-left-color: var(--accent); }
  .toast.info svg { color: var(--accent); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
    box-sizing: border-box; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* A ring reads as progress at size; a thin arc reads as a flickering bar. */
  .spin-lg { width: 34px; height: 34px; border-width: 3px; vertical-align: 0;
    border-color: var(--border); border-top-color: var(--accent);
    border-right-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    animation-duration: .9s; }
  code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; width: 100%; min-width: 0; height: auto; flex-direction: row; overflow-x: auto; }
    main { padding: 18px; }
    .prep-note-editor { align-items: stretch; flex-direction: column; }
    .prep-note-editor button { align-self: flex-end; }
  }
  @media (max-height: 700px) {
    .modal.writing-modal { max-height: calc(100vh - 24px); overflow-y: auto; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <svg class="quill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 4C11 5 7 10 6 16l-2 4"/><path d="M13 5c3 3 4 7 3 11-3 1-7 0-10-3"/>
      </svg>
      <div><b>Canon Quill</b>
        <div class="verline"><span class="ver" id="ver"></span><span id="verbadge"></span></div>
      </div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="view"></main>
</div>

<script>
// Canon Quill Studio front end. Plain JS, no build step.
let S = null;              // active book state, null when no book is selected
let PROJECTS = [];
let route = "connect";
let browse = { folderId: "root", crumbs: [{ id: "root", name: "My Drive" }], entries: [], loading: false };
let picked = new Map();    // driveId -> name, chosen reference roots
let target = null;         // {id, name} of the folder finished chapters go to
let indexing = false;
let draftPicker = false;
let draftAnalysisLoading = false;
let indexError = null;
let selectionSave = Promise.resolve();
let questionPoll = null;
let chapterPoll = null;
let questionSnapshot = null;
let chapterSnapshot = null;
let projectAnalysisLoading = false;
let seriesDragId = null;
let collapsedGroups = { "Set up": false, Prepare: false, Write: false };
let chapterChat = null;
let runProgress = null;
let runAgents = [];
let displayedRunPercent = null;
let runPercentAnimation = null;
let runOutput = null;
let dismissedOutputAlerts = new Set();
let sourceAnalysisStarted = false;

// Filled from /api/state so there is only ever one definition of these.
let KINDS = {};
let KIND_COUNTS = {};
let KIND_PURPOSE = {};
let NARRATION_OPTIONS = [];
let POV_OPTIONS = ["Close third", "First person", "Multiple POVs", "Omniscient third", "Second person"];
let TENSE_OPTIONS = ["Mixed", "Past", "Present"];

const PHASES = [
  { id: "start",       label: "Starting point", group: "Set up" },
  { id: "engine",      label: "Writing engine", group: "Set up" },
  { id: "connect",     label: "Add resources", group: "Set up" },
  { id: "sources",     label: "Select sources", group: "Set up" },
  { id: "analyze",     label: "Analyse & group", group: "Set up" },
  { id: "intake",      label: "Project shape",  group: "Prepare" },
  { id: "draft",       label: "Existing draft", group: "Prepare" },
  { id: "style",       label: "Style corpus",   group: "Prepare" },
  { id: "intake_analysis", label: "Project analysis", group: "Prepare" },
  { id: "questions",   label: "Questions",      group: "Prepare" },
  { id: "preparation", label: "Preparation",   group: "Prepare" },
  { id: "chapters",    label: "Chapters",       group: "Write" }
];

// --- api -------------------------------------------------------------------
async function api(path, options) {
  const res = await fetch(path, {
    headers: { "content-type": "application/json" },
    ...options,
    body: options?.body ? JSON.stringify(options.body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

const TOAST_ICONS = {
  success: '<path d="M20 6L9 17l-5-5"/>',
  error: '<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',
  warn: '<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.01"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>'
};

/**
 * `kind` is one of success, error, warn, info. A boolean is still accepted so
 * older call sites keep working, mapping true to error.
 */
function toast(msg, kind = "success") {
  const type = kind === true ? "error" : kind === false ? "success" : kind;
  let stack = document.getElementById("toast-stack");
  if (!stack) {
    stack = document.createElement("div");
    stack.id = "toast-stack";
    stack.className = "toast-stack";
    stack.setAttribute("aria-live", "polite");
    document.body.appendChild(stack);
  }
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
    stroke-linecap="round" stroke-linejoin="round">${TOAST_ICONS[type] || TOAST_ICONS.info}</svg>
    <span></span>`;
  el.querySelector("span").textContent = msg;
  stack.appendChild(el);
  setTimeout(() => {
    el.remove();
    if (!stack.childElementCount) stack.remove();
  }, type === "error" ? 7000 : type === "warn" ? 5500 : 3500);
}

let VERSION = null;
let updating = false;
let updateResult = null;

async function loadVersion(remote) {
  try { VERSION = await api(`/api/version${remote ? "?remote=1" : ""}`); renderVersion(); }
  catch { /* version display is advisory */ }
}

function renderVersion() {
  const v = document.getElementById("ver");
  const badge = document.getElementById("verbadge");
  if (!v || !badge) return;
  if (!VERSION) { v.textContent = ""; badge.innerHTML = ""; return; }
  // The commit sha belongs in the panel, not next to the name.
  v.textContent = `v${VERSION.version}`;
  // Neither of these is an emergency, so neither shouts. Running stale local
  // code comes first because it is the more confusing to hit blind: requests
  // fail against fields the process predates.
  badge.innerHTML = VERSION.localStale
    ? `<button class="newver attn" title="This Studio is running older code than is on disk" onclick="openUpdate()">!</button>`
    : VERSION.behind > 0
      ? `<button class="newver up" title="${VERSION.behind} update${VERSION.behind === 1 ? "" : "s"} available" onclick="openUpdate()">${VERSION.behind > 9 ? "9+" : VERSION.behind}</button>`
      : "";
}

/**
 * A single modal implementation. Everything that needs to ask something uses
 * it, so nothing falls back to prompt(), which cannot be styled and reads as a
 * browser warning rather than part of the app.
 */
function showModal({ title, body, actions, onOpen, dismissable = true, size = "" }) {
  closeModal();
  const wrap = document.createElement("div");
  wrap.id = "modal";
  wrap.className = "modal-bg";
  if (dismissable) wrap.onclick = (e) => { if (e.target === wrap) closeModal(); };
  wrap.innerHTML = `<div class="modal ${size}">
    <h3>${title}</h3>
    ${body}
    <div class="row" style="margin-top:18px">${actions}</div>
  </div>`;
  document.body.appendChild(wrap);
  if (dismissable) {
    document.addEventListener("keydown", escClose);
  }
  onOpen?.();
}
function escClose(e) { if (e.key === "Escape") closeModal(); }
function closeModal() {
  document.getElementById("modal")?.remove();
  document.removeEventListener("keydown", escClose);
}

function newBookModal() {
  showModal({
    title: "New book",
    body: `<p class="hint" style="margin:0 0 12px">Each book gets its own workspace: its own sources,
      style corpus, chapters and continuity. Nothing is shared between books.</p>
      <label>Title</label>
      <input id="booktitle" placeholder="A working title"
        onkeydown="if(event.key==='Enter')createBook(document.getElementById('createbtn'))" />
      <div id="bookerr" class="hint" style="margin-top:6px"></div>`,
    actions: `<button id="createbtn" onclick="createBook(this)">Create book</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>`,
    onOpen: () => document.getElementById("booktitle")?.focus()
  });
}

async function createBook(btn) {
  const input = document.getElementById("booktitle");
  const title = input?.value?.trim();
  const err = document.getElementById("bookerr");
  if (!title) { if (err) err.innerHTML = '<span style="color:var(--warn)">Give the book a title.</span>'; input?.focus(); return; }

  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Creating…';
  try {
    const r = await api("/api/projects", { method: "POST", body: { title } });
    closeModal();
    await reload();
    route = "start"; render();
    toast(`Created "${r.project.title}".`);
  } catch (e) {
    if (err) err.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`;
    btn.disabled = false; btn.textContent = "Create book";
  }
}

function openUpdate() { updateResult = null; render(); renderModal(); }


function renderModal() {
  closeModal();
  const v = VERSION;
  if (!v) return;
  const wrap = document.createElement("div");
  wrap.id = "modal";
  wrap.className = "modal-bg";
  wrap.onclick = (e) => { if (e.target === wrap && !updating) closeModal(); };

  const commits = v.pending.map((c) => `
    <div class="commit"><code>${esc(c.sha)}</code> ${esc(c.subject)}
      <div style="color:var(--faint);font-size:11px">${new Date(c.date).toLocaleString()}</div></div>`).join("");

  const steps = (updateResult?.steps || []).map((st) => `
    <div style="margin-top:10px"><b style="font-size:12.5px;color:var(--${st.ok ? "good" : "bad"})">
      ${st.ok ? "✓" : "✗"} ${esc(st.label)}</b>
      ${st.output ? `<div class="steplog">${esc(st.output)}</div>` : ""}</div>`).join("");

  const staleOnly = v.localStale && v.behind === 0;
  wrap.innerHTML = `<div class="modal">
    <h3>${staleOnly ? "Restart to pick up your changes" : plural(v.behind, "update") + " available"}</h3>
    <p class="hint" style="margin:0 0 14px">Version ${esc(v.version)}${
      v.commit ? `, commit <code>${esc(v.commit)}</code>` : ""}${v.branch ? ` on <code>${esc(v.branch)}</code>` : ""}.</p>

    ${v.localStale ? `<div class="info warn"><svg class="ic" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/>
        <path d="M12 8v5M12 16.5v.01"/></svg><div><b>Running older code than is on disk</b>
        <p>Source files changed after this process started. The screens reload, but the behaviour behind
        them does not, so a request can fail against a field this process has never heard of. Restarting
        fixes it and loses nothing.</p></div></div>` : ""}

    ${!staleOnly ? `<p class="hint" style="margin:0 0 14px">Updating pulls, reinstalls dependencies and
      rebuilds.</p>` : ""}

    ${v.blocked ? `<div class="info warn"><svg class="ic" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/>
        <path d="M12 8v5M12 16.5v.01"/></svg><div><b>Cannot update automatically</b>
        <p>${esc(v.blocked)}</p></div></div>` : ""}

    ${!staleOnly && updateResult ? `<div style="margin-bottom:14px">
        <b style="font-size:13px">${updateResult.ok ? "Update applied" : "Update failed"}</b>${steps}
        ${updateResult.ok ? `<p class="hint" style="margin-top:12px">Restart to run the new code.
          The page reconnects on its own.</p>` : ""}
      </div>` : (staleOnly ? "" : `<div style="max-height:220px;overflow-y:auto;margin-bottom:14px">${commits}</div>`)}

    <div class="row">
      ${updateResult?.ok || staleOnly
        ? `<button onclick="restartStudio(this)">Restart now</button>`
        : `<button ${v.blocked || updating ? "disabled" : ""} onclick="runUpdate(this)">
             ${updating ? '<span class="spin"></span> Updating…' : "Download and install"}</button>`}
      <button class="ghost" ${updating ? "disabled" : ""} onclick="closeModal()">Close</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
}

async function runUpdate(btn) {
  updating = true; renderModal();
  try { updateResult = await api("/api/version/update", { method: "POST" }); }
  catch (e) { updateResult = { ok: false, steps: [{ label: "Request", ok: false, output: e.message }] }; }
  updating = false; renderModal();
}

async function restartStudio(btn) {
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Restarting…';

  try {
    await api("/api/version/restart", { method: "POST" });
  } catch (e) {
    toast(e.message, "error");
    btn.disabled = false; btn.textContent = "Restart now";
    return;
  }

  await new Promise((r) => setTimeout(r, 2000));

  for (let i = 0; i < 60; i++) {
    try {
      await api("/api/version");
      await new Promise((r) => setTimeout(r, 400));
      location.reload();
      return;
    } catch {
      await new Promise((r) => setTimeout(r, 1000));
    }
  }

  btn.disabled = false; btn.textContent = "Restart now";
  toast("The Studio did not come back. Check the terminal and start it again.", "error");
}

async function reload(attempt = 0) {
  try {
    const r = await api("/api/state");
    S = r.state; PROJECTS = r.projects || [];
    questionSnapshot = null;
    startSelection = S && !S.projectStart ? readStartDraft().projectStart || null : null;
    KINDS = r.kinds || KINDS; KIND_COUNTS = r.kindCounts || KIND_COUNTS;
    KIND_PURPOSE = r.kindPurpose || KIND_PURPOSE;
    NARRATION_OPTIONS = r.narrationOptions || NARRATION_OPTIONS;
    POV_OPTIONS = r.povOptions || POV_OPTIONS;
    TENSE_OPTIONS = r.tenseOptions || TENSE_OPTIONS;
    if (S) {
      picked = new Map((S.drive.referenceRoots || []).map((id) => [id, S.drive.referenceRootNames?.[id] || id]));
      target = S.drive.targetFolderId
        ? { id: S.drive.targetFolderId, name: S.drive.targetFolderName || S.drive.targetFolderId }
        : null;
    } else {
      picked.clear();
      target = null;
    }
    render();
  } catch (e) {
    if (attempt < 20) {
      const view = document.getElementById("view");
      if (view && !S) {
        view.innerHTML = `<div class="card empty"><span class="spin"></span><br><br>
          Reconnecting to the Studio...<div class="hint" style="margin-top:6px">If this does not clear, run <code>npm run studio</code> in the project folder.</div></div>`;
      }
      setTimeout(() => reload(attempt + 1), 1000);
    } else {
      toast(`The Studio is not responding: ${e.message}`, "error");
    }
  }
}



async function switchProject(slug) {
  try { await api(`/api/projects/${slug}/activate`, { method: "POST" }); await reload(); }
  catch (e) { toast(e.message, "error"); }
}

// --- helpers ---------------------------------------------------------------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fidelityClass(v) { return v >= 80 ? "good" : v >= 60 ? "warn" : "bad"; }

/** "1 book" / "2 books". Pass an explicit plural for irregular words, and
 *  `display` when the number needs formatting (thousands separators). */
function plural(n, one, many, display) { return `${display ?? n} ${n === 1 ? one : (many || one + "s")}`; }
function chapterStats(counts) {
  if (!counts.length) return null;
  return {
    min: Math.min(...counts),
    max: Math.max(...counts),
    average: Math.round(counts.reduce((sum, count) => sum + count, 0) / counts.length)
  };
}
/** The verb to agree with a count. */
function verb(n, one, many) { return n === 1 ? one : many; }

// --- nav -------------------------------------------------------------------
function renderNav() {
  const nav = document.getElementById("nav");
  const blocking = (S?.questions || []).filter((q) => q.blocking && q.answer === undefined).length;

  let html = `<div class="navgroup">Book</div>
    ${PROJECTS.length ? `<select onchange="switchProject(this.value)"
      style="margin-bottom:6px;font-size:12.5px;padding:6px 8px">
      ${PROJECTS.map((p) => `<option value="${p.slug}" ${S && p.slug === S.slug ? "selected" : ""}>
        ${esc(p.title)}${p.status === "finished" ? " (finished)" : ""}</option>`).join("")}
    </select>` : ""}
    <button class="ghost sm" style="width:100%;margin-bottom:6px" onclick="newBookModal()">+ New book</button>`;

  if (S) {
    let group = "";
    const order = phaseOrder();
    for (const p of PHASES.filter((phase) => order.includes(phase.id))) {
      if (p.group !== group) {
        group = p.group;
        html += `<button class="navgroup navgroup-toggle" onclick="toggleNavGroup('${group}')">
          <span>${group}</span><span>${collapsedGroups[group] ? "▸" : "▾"}</span></button>`;
      }
      if (collapsedGroups[group]) continue;
      const locked = isLocked(p.id);
      const done = !locked && isDone(p.id);
      const cur = !locked && !done && (route === p.id || phaseOrder()[furthestReached()] === p.id);
      html += `<button class="navitem ${route === p.id ? "active" : ""} ${done ? "done" : ""} ${cur ? "current" : ""} ${locked ? "locked" : ""}"
        onclick="go('${p.id}')" ${locked ? 'title="Finish the earlier steps first"' : ""}>
        <span class="dot"></span>${p.label}${
        p.id === "questions" && blocking ? `<span class="badge">${blocking}</span>` : ""}${
        locked ? `<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>` : ""}</button>`;
    }
  }
  nav.innerHTML = html;
  renderVersion();
}

function isDone(id) {
  if (!S) return false;
  switch (id) {
    case "start":     return !!effectiveProjectStart();
    case "engine":    return engineAssignmentsReady() && !!S.engineReviewed;
    case "connect":   return S.drive.connected;
    case "sources": {
      const hasSources = S.drive.referenceRoots.length > 0
        || picked.size > 0
        || S.sources.some((source) => source.driveId.startsWith("local-"));
      return !indexError && hasSources
        && (sourceAnalysisStarted || S.sourcesReviewed);
    }
    case "analyze":   return !indexError && S.sources.length > 0 && S.sourcesReviewed;
    case "intake":    return !!S.shape && !!S.draftingMode && !!S.projectShapeReviewed;
    case "draft":     return !!S.manuscriptReviewed;
    // Answered either way: a draft was picked, or starting fresh was chosen.
    case "style":     return S.styleCorpus.built;
    case "intake_analysis": return S.projectAnalysis?.completed;
    // Closing the preparation gate finishes this step, whether it took
    // questions or none. An untouched step is not green.
    case "questions": return !!S.writingConfirmed
      || (!!S.conversationStartedAt && !(S.questions || []).some((q) => q.answer === undefined));
    case "preparation": return !!S.preparationReviewed;
    case "chapters":  return S.chapters.length > 0 && S.chapters.every((c) => c.status === "approved");
  }
  return false;
}

/** Steps in order. You may revisit anything reached, but not skip ahead. */
function phaseOrder() {
  const projectStart = effectiveProjectStart();
  if (!projectStart) return ["start"];
  if (projectStart === "from_scratch") {
      return ["start", "engine", "intake", "draft", "intake_analysis", "questions", "preparation", "chapters"];
  }
  const order = ["start", "engine", "connect", "sources", "analyze", "intake", "draft", "style", "intake_analysis", "questions", "preparation", "chapters"];
  return order.filter((id) => id !== "style" || S.sources.some((source) => source.kinds?.includes("past_book")));
}

function engineAssignmentsReady() {
  if (!S?.engine) return false;
  const e = S.engine;
  const draftingProvider = e.draftingProvider || e.provider;
  const draftingAuth = e.draftingAuthMethod || e.authMethod;
  const analysisProvider = e.analysisProvider || draftingProvider;
  const analysisAuth = e.analysisAuthMethod || draftingAuth;
  return !!(draftingProvider && draftingAuth && analysisProvider && analysisAuth);
}

function furthestReached() {
  if (!S) return 0;
  const map = { start: "start", engine: "engine", connect: "connect", sources: "sources", analyze: "analyze",
    intake: "intake", draft: "draft", preparation: S.conversationStartedAt ? "preparation" : "style", intake_analysis: "intake_analysis", preflight: "questions", writing: "chapters",
    review: "chapters", export: "chapters", complete: "chapters" };
  const current = map[S.phase] || "engine";
  return Math.max(phaseOrder().indexOf(current), 0);
}

function isLocked(id) {
  if (id === "analyze" && (route === "analyze" || indexing)) return false;
  const i = phaseOrder().indexOf(id);
  return i > furthestReached();
}

function go(r) {
  if (isLocked(r)) {
    const need = phaseOrder()[furthestReached()];
    const label = PHASES.find((p) => p.id === need)?.label || need;
    toast(`Finish ${label} first.`, "info");
    return;
  }
  route = r; analysisEditing = false; render();
  if (r === "intake") requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: "auto" }));
  if (r === "sources" && (S.drive.connected || !(S.sources || []).some((source) => source.driveId.startsWith("local-")))) loadBrowse(browse.folderId);   // always re-fetch when Drive is available
  if (r === "engine") loadEngine();
  if (r === "connect") loadDrive();
  if (r === "analyze") loadCheck();
  if (r === "intake") loadSuggestions();
  if (r === "style" && S.styleCorpus.built) loadFingerprint();
  if (r === "questions") { loadQuestions(); startQuestionPolling(); }
  else stopQuestionPolling();
  if (r === "preparation") enterPreparation();
  if (r === "chapters") enterChapters(); else if (r !== "preparation") stopChapterPolling();
}

function toggleNavGroup(group) {
  collapsedGroups[group] = !collapsedGroups[group];
  renderNav();
}

// --- views -----------------------------------------------------------------
function render() {
  renderNav();
  const v = document.getElementById("view");
  if (!S) {
    v.innerHTML = `
      <div style="max-width:52ch;margin:8vh auto 0;text-align:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.4"
          stroke-linecap="round" stroke-linejoin="round" style="width:52px;height:52px;margin-bottom:14px">
          <path d="M20 4C11 5 7 10 6 16l-2 4"/><path d="M13 5c3 3 4 7 3 11-3 1-7 0-10-3"/></svg>
        <h1 style="font-size:24px">Start your first book</h1>
        <p class="sub" style="margin:8px auto 22px">Each book gets its own workspace with its own sources,
        style corpus, chapters and continuity. Books are independent, and finishing one never deletes it.</p>
        <button style="padding:11px 22px;font-size:14.5px" onclick="newBookModal()">Create a book</button>
      </div>`;
    return;
  }
  rememberRunConsolePosition(document.getElementById("runlog"));
  v.innerHTML = ({
    start: viewStart, engine: viewEngine, connect: viewConnect, sources: viewSources, analyze: viewAnalyze,
    intake: viewIntake, draft: viewDraft, style: viewStyle, intake_analysis: viewIntakeAnalysis, questions: viewQuestions, preparation: viewChapters, chapters: viewChapters
  }[route] || viewConnect)();
  applyPreparationLock(v);
  requestAnimationFrame(restoreRunConsolePosition);
  if (isRunBoard() && S?.run?.status === "running") {
    requestAnimationFrame(() => animateRunProgress(progressForRun(S.run).percent));
  }
}

function applyPreparationLock(view) {
  const locked = Boolean(S?.writingConfirmed) && route !== "chapters";
  view.classList.toggle("readonly", locked);
  if (!locked) return;

  for (const field of view.querySelectorAll("input, textarea, select")) field.disabled = true;
  for (const button of view.querySelectorAll("button")) {
    if (/^(continue|begin|start|build|rebuild|analyse|analyze|save|add|apply|remove|replace|connect)\b/i
      .test(button.textContent.trim())) button.remove();
    else button.disabled = true;
  }
  view.insertAdjacentHTML("afterbegin", `<div class="info" style="margin:0 0 14px">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
    <div style="flex:1"><b>Preparation is closed</b><p>This is the record of what the writing is held to. You can
      read every screen, but nothing here changes while the book is being written.</p>
      <button class="ghost sm" style="margin-top:8px" onclick="reopenPreparation(this)">Reopen preparation</button>
    </div></div>`);
}

let ENGINE = null;
let startSelection = null;

function startDraftKey() { return S ? `canon-quill-start:${S.slug}` : "canon-quill-start"; }
function effectiveProjectStart() {
  if (S?.projectStart) return S.projectStart;
  const draft = readStartDraft();
  if (draft.projectStart) return draft.projectStart;
  if (S?.engine?.provider || S?.engine?.analysisProvider || S?.engine?.draftingProvider) return "with_material";
  return null;
}
function readStartDraft() {
  try { return JSON.parse(sessionStorage.getItem(startDraftKey()) || "null") || {}; }
  catch { return {}; }
}
function saveStartDraft(projectStart, startingBrief) {
  try { sessionStorage.setItem(startDraftKey(), JSON.stringify({ projectStart, startingBrief })); }
  catch { /* session storage is only a navigation convenience */ }
}
function clearStartDraft() {
  try { sessionStorage.removeItem(startDraftKey()); }
  catch { /* session storage is only a navigation convenience */ }
}

function viewStart() {
  const draft = readStartDraft();
  const selected = startSelection || S.projectStart || draft.projectStart;
  const brief = S.startingBrief || draft.startingBrief || "";
  const locked = Boolean(S.projectStart);
  return `
  <h1>How are you starting this book?</h1>
  <p class="sub">This decides whether Canon Quill waits for planning material or helps you build the project from a detailed brief.</p>
  <div class="choices">
    <div class="choice ${locked ? "locked " : ""}${selected === "from_scratch" ? "on" : ""}" onclick="${locked ? "" : "chooseProjectStart('from_scratch')"}" aria-disabled="${locked}">
      <b>From scratch</b>
      <p>No plan, timeline, character file or outline yet. You will first describe in detail what the book is about, then we set up the project.</p>
    </div>
    <div class="choice ${locked ? "locked " : ""}${selected === "with_material" ? "on" : ""}" onclick="${locked ? "" : "chooseProjectStart('with_material')"}" aria-disabled="${locked}">
      <b>I already have material</b>
      <p>I have a plan, timeline, characters, outline or related documents. Upload files directly or connect Google Drive and choose what Canon Quill may read.</p>
    </div>
  </div>
  ${selected === "from_scratch" ? `<div class="card">
    <label>What is this book about?</label>
    <p class="hint">Describe the premise, protagonist, conflict, setting, tone and anything you already know. The more concrete this is, the fewer assumptions the preparation phase has to make.</p>
    <textarea id="starting-brief" rows="9" placeholder="This book is about..." ${locked ? "readonly" : ""} oninput="saveStartDraft('from_scratch',this.value);document.getElementById('start-continue').disabled=this.value.trim().length<40">${esc(brief)}</textarea>
  </div>` : ""}
  <div class="row" style="margin-top:16px">
    ${locked ? "" : `<button id="start-continue" ${selected && (selected !== "from_scratch" || brief.trim().length >= 40) ? "" : "disabled"} onclick="continueProjectStart(this)">Continue</button>
    ${selected === "from_scratch" && brief.trim().length < 40 ? '<span class="hint" style="color:var(--warn)">Write a few detailed sentences before continuing.</span>' : ""}`}
  </div>`;
}

function chooseProjectStart(projectStart) {
  startSelection = projectStart;
  const draft = readStartDraft();
  saveStartDraft(projectStart, projectStart === "from_scratch" ? draft.startingBrief || S.startingBrief || "" : "");
  render();
}

async function continueProjectStart(btn) {
  const draft = readStartDraft();
  const projectStart = startSelection || S.projectStart || draft.projectStart;
  const startingBrief = document.getElementById("starting-brief")?.value || S.startingBrief || draft.startingBrief || "";
  if (!projectStart) return;
  btn.disabled = true;
  try {
    S = await api("/api/project/start", { method: "POST", body: { projectStart, startingBrief } });
    startSelection = null;
    clearStartDraft();
    route = "engine";
    render();
    loadEngine();
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

async function loadEngine() {
  try { ENGINE = await api("/api/engine"); if (route === "engine") render(); }
  catch (e) { toast(e.message, "error"); }
}

function viewEngine() {

    const same = split && entries[0][1] === entries[1][1]

    const shown = same

    return shown.filter(([, provider]) => provider).map(([label, provider, status]) => status ? `<div class="info ${status.ready ? "ok" : "warn"}">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">

   ${cat.estimates && (split ? analysisAuth !== "subscription" || draftingAuth !== "subscription" : choice.authMethod !== "subscription") ? renderEstimates(cat, draftingProvider) : ""}
   ${assignmentReady && (split ? analysisAuth === "subscription" && draftingAuth === "subscription" : choice.authMethod === "subscription") ? `<div class="info">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M20 6L9 17l-5-5"/></svg>
    <div><b>No per-token cost</b>
      <p>Writing is covered by your plan, subject to its usage limits.</p></div></div>` : ""}` : ""}

  ${assignmentReady ? `<button onclick="continueEngine(this)">Continue</button>` : ""}`;
}

function renderEstimates(cat, provider) {
  const e = cat.estimates || {};

async function saveKey(btn, provider) {
  const input = document.getElementById(`apikey-${provider}`);
  const key = input?.value?.trim();
  const out = document.getElementById(`keyresult-${provider}`);
  if (!key) { toast("Paste a key first.", "warn"); return; }

  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Verifying…';
  try {
    const r = await api("/api/engine/key", { method: "POST", body: { provider, key } });
    if (input) input.value = "";
    if (out) out.innerHTML = `<span style="color:var(--${r.verification.ok ? "good" : "warn"})">${
      r.verification.ok ? "✓" : "!"} ${esc(r.verification.detail)}</span>`;
    toast(r.verification.ok ? "Key saved and verified." : "Key saved, but it did not verify.", r.verification.ok ? "success" : "warn");
    await loadEngine(); await reload();
  } catch (e) { toast(e.message, "error"); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = "Save and verify"; } }
}

async function verifyKey(btn, provider) {
  const out = document.getElementById(`keyresult-${provider}`);
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await api("/api/engine/key/verify", { method: "POST", body: { provider } });

  } catch (e) { toast(e.message, "error"); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = "Verify"; } }
}

async function connectDrive(btn) {
  const originalLabel = btn.textContent || "Connect Google Drive";
  const popup = window.open("about:blank", "_blank", "noopener");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Opening Google…';
  try {
    const { url } = await api("/api/drive/connect", { method: "POST" });
    if (popup) popup.location.href = url;
    const link = document.getElementById("authlink");
    if (link) link.innerHTML = `If the window did not open, <a href="${esc(url)}" target="_blank" rel="noopener">authorise here</a>. This page updates once you approve.`;
    // The exchange finishes server-side; poll until the token lands.
    for (let i = 0; i < 90; i++) {
      await new Promise((r) => setTimeout(r, 2000));
      const status = await api("/api/drive/status");
      if (status.connected) {
        DRIVE = status;
        showDriveRecovery = false;
        // The previous listing was fetched under the old grant; drop it.
        browse.entries = []; browse.folderId = "root"; browse.crumbs = [{ id: "root", name: "My Drive" }];
        toast("Drive connected."); await reload(); render(); return;
      }
    }
    toast("Still waiting for authorisation. Press Check again once you have approved.", "warn");
  } catch (e) {
    if (popup) popup.close();
    toast(e.message, "error");
  }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = originalLabel; } }
}

async function checkDrive(btn) {
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Checking'; }
  try {
    DRIVE = await api("/api/drive/status");
    if (DRIVE.connected) showDriveRecovery = false;
    await reload(); render();
  }
  catch (e) { toast(e.message, "error"); if (btn) { btn.disabled = false; btn.textContent = "Check again"; } }
}

function showSelectedFiles(input) {
  const target = document.getElementById("selected-files");
  const files = [...(input?.files || [])];
  if (target) target.textContent = files.length ? files.map((file) => file.name).join(", ") : "No file selected";
}

async function uploadSources(btn) {
  const input = document.getElementById("local-sources");
  const files = [...(input?.files || [])];

  btn.disabled = true;
  try {

    S = await api("/api/sources/upload", { method: "POST", body: { files: payload } });
    route = "sources";
    await reload();
    render();
    toast(`${payload.length} file${payload.length === 1 ? "" : "s"} uploaded.`);
  } catch (e) { toast(e.message, "error"); }
  finally { if (btn.isConnected) btn.disabled = false; }
}

async function loadBrowse(folderId) {
  browse.loading = true; render();
  try {
    const r = await api(`/api/drive/browse?folderId=${encodeURIComponent(folderId)}`);
    browse.entries = r.entries; browse.folderId = folderId;
    browse.emptyBecauseScope = r.emptyBecauseScope; browse.canBrowse = r.canBrowse;
  } catch (e) { toast(e.message, "error"); browse.entries = []; }
  browse.loading = false; render();
}
function openFolder(id, name) { browse.crumbs.push({ id, name }); loadBrowse(id); }
function jump(i) { browse.crumbs = browse.crumbs.slice(0, i + 1); loadBrowse(browse.crumbs[i].id); }
function saveSourceSelections() {
  const body = {
    roots: [...picked.keys()],
    referenceNames: Object.fromEntries(picked),
    targetFolderId: target?.id || "",
    targetFolderName: target?.name || ""
  };
  selectionSave = selectionSave.then(async () => {
    S = await api("/api/drive/roots", { method: "POST", body });
  }).catch((e) => toast(`Could not save source selections: ${e.message}`, "error"));
  return selectionSave;
}
function toggleRef(id, name) { sourceAnalysisStarted = false; picked.has(id) ? picked.delete(id) : picked.set(id, name); render(); saveSourceSelections(); }
function unpick(id) { sourceAnalysisStarted = false; picked.delete(id); render(); saveSourceSelections(); }
function pickTarget(id, name) { sourceAnalysisStarted = false; target = target?.id === id ? null : { id, name }; render(); saveSourceSelections(); }
function clearTarget() { sourceAnalysisStarted = false; target = null; render(); saveSourceSelections(); }

/**
 * Analysing replaces the whole grouping, so an existing one is worth a warning:
 * any corrections made by hand on the board are lost.
 */
function analyseSources(btn) {
  const existing = (S.sources || []).length;
  if (!existing) return runAnalysis(btn);

  const touched = S.sources.filter((x) => (x.kinds || []).length).length;
  showModal({
    title: "Replace the current analysis?",
    body: `<p class="hint" style="margin:0 0 10px">This book already has
      <b>${plural(existing, "document")}</b> indexed${touched ? `, ${touched} of them grouped` : ""}.</p>
      <p class="hint" style="margin:0">Analysing again reads your Drive from scratch and replaces the
      grouping entirely. Any groups you set by hand are lost. Chapters, continuity and the style corpus
      are not affected.</p>`,
    actions: `<button onclick="closeModal();runAnalysis()">Replace analysis</button>
      <button class="ghost" onclick="closeModal()">Keep what I have</button>`
  });
}

async function runAnalysis(btn) {
  if (btn) btn.disabled = true;
  indexError = null;
  indexing = true;
  sourceAnalysisStarted = true;
  render();
  await new Promise((resolve) => requestAnimationFrame(resolve));
  route = "analyze";
  render();
  try {
    if (!S.drive.connected && (S.sources || []).some((source) => source.driveId.startsWith("local-"))) {
      S = await api("/api/sources/reviewed", { method: "POST" });
      indexing = false;
      route = "analyze";
      await loadCheck();
      toast("Uploaded files are ready to review.");
      render();
      return;
    }
    await saveSourceSelections();
    S = await api("/api/sources/index", { method: "POST" });
    indexing = false;
    await loadCheck();
    toast(`Indexed ${plural(S.sources.length, "document")} from your Drive.`);
  } catch (e) {
    indexing = false;
    indexError = e.message;
    sourceAnalysisStarted = false;
    route = "sources";
    toast(e.message, "error");
  }
  render();
}

async function reviewUploadedSources(btn) {
  btn.disabled = true;
  try {
    S = await api("/api/sources/reviewed", { method: "POST" });
    route = "analyze";
    await loadCheck();
    render();
  } catch (e) { toast(e.message, "error"); btn.disabled = false; }
}

function viewAnalyze() {
  if (indexing) return `
    <h1>Analyse and group</h1>
    <div class="card" style="text-align:center;padding:44px 20px">
      <div style="margin-bottom:16px;line-height:0"><span class="spin spin-lg"></span></div>
      <b>Reading your Drive</b>
      <p class="sub" style="margin:8px auto 0;max-width:46ch">Walking each folder, downloading every
      document and sorting it into groups. A large folder can take a few minutes. You can leave this
      page open.</p>
    </div>`;

  if (indexError) return `
    <h1>Analyse and group</h1>
    <div class="info warn">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
      <div><b>Indexing failed</b><p>${esc(indexError)}</p></div></div>
    <button onclick="go('sources')">Back to sources</button>`;

  if (!S.sources.length) return `<h1>Analyse and group</h1>
    <p class="sub">Nothing indexed yet.</p><button onclick="go('sources')">Select sources</button>`;

  const counts = Object.fromEntries(Object.keys(KINDS).map((k) =>
    [k, S.sources.filter((x) => (x.kinds || []).includes(k)).length]));

  // Alphabetical: Drive's own order is arbitrary and a long board is unusable
  // without somewhere predictable to look.
  const sorted = [...S.sources].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  const docs = sorted.map((src) => {
    const ungrouped = !(src.kinds || []).length;
    return `
    <div class="doc ${ungrouped ? "ignored" : ""}">
      <div class="doc-h">
          <div><b>${esc(src.name)}</b>
          <div class="doc-m">${esc(src.path || "")}${src.wordCount ? ` · ${plural(src.wordCount, "word", null, src.wordCount.toLocaleString())}` : ""}${src.classification ? ` · ${Math.round(src.classification.confidence * 100)}% confidence` : ""}</div>
        </div>
        <button class="doc-x" title="Remove from this analysis" onclick="removeSource('${src.driveId}')">✕</button>
      </div>
      ${src.classification?.reasons?.length ? `<div class="hint" style="margin-top:7px">Why: ${esc(src.classification.reasons.join("; "))}
        ${src.classification.alternative ? ` · alternative: ${esc(KINDS[src.classification.alternative] || src.classification.alternative)}` : ""}</div>` : ""}
      <div class="chips">
        ${Object.entries(KINDS).map(([k, label]) => {
          const on = (src.kinds || []).includes(k);
          return `<button class="chip ${on ? "on" : ""}" title="${esc(KIND_PURPOSE[k] || "")}"
            onclick="toggleKind('${src.driveId}','${k}')">${esc(label)}</button>`;
        }).join("")}
      </div>
      ${ungrouped ? `<div class="doc-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
          style="width:12px;height:12px;flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
        No group, so this document will be ignored. Pick a label, or remove it.</div>` : ""}
    </div>`;
  }).join("");

  const unassigned = S.sources.filter((x) => !(x.kinds || []).length).length;

  return `
  <h1>Analyse and group</h1>
  <p class="sub">Every document was read and sorted. Correct anything in the wrong place by clicking the
  labels. A document can belong to several groups at once, which is common: one file often holds a
  timeline, an outline and loose notes.</p>

  ${check ? `<div class="reqs">
    ${[["Voice reference (required)", check.style, "at least 2,000 words of prose"],
        ["Plot & outline (required)", check.plot, "at least one plot or outline"]].map(([title, r, purpose]) => `
      <div class="req ${r.ok ? "ok" : "todo"}">
        <div class="req-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
            style="width:14px;height:14px;flex:none">
            ${r.ok ? '<path d="M20 6L9 17l-5-5"/>' : '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>'}
          </svg>
          <b>${title}</b>

    return `<div class="count ${n ? "" : "zero"}"><b>${n}</b><span>${esc(name)}</span></div>`;

}

async function loadCheck() {

async function toggleKind(driveId, kind) {
  const src = S.sources.find((x) => x.driveId === driveId);
  if (!src) return;
  if (kind === "reference_book" && (src.kinds || []).includes("past_book")) {
    showModal({
      title: "Series books are voice references too",
      body: `<p><b>${esc(src.name)}</b> is marked as a Series book, so it is automatically used as a voice reference.</p>
        <p class="hint">Choose whether to remove both labels or keep both. To remove only Series book, close this message and click the Series book label directly.</p>`,
      actions: `<button onclick="removeBothSourceRoles('${driveId}')">Remove both</button>
        <button class="ghost" onclick="closeModal()">Keep both</button>`
    });
    return;
  }
  const kinds = new Set(src.kinds || []);
  kinds.has(kind) ? kinds.delete(kind) : kinds.add(kind);
  src.kinds = [...kinds];          // optimistic: the board stays responsive
  render();
  try {
    S = await api(`/api/sources/${driveId}`, { method: "PATCH", body: { kinds: src.kinds } });
    await loadCheck();
  } catch (e) { toast(e.message, "error"); await reload(); }
}

async function removeBothSourceRoles(driveId) {
  const src = S.sources.find((x) => x.driveId === driveId);
  if (!src) return;
  closeModal();
  try {
    S = await api(`/api/sources/${driveId}`, {
      method: "PATCH",
      body: { kinds: (src.kinds || []).filter((kind) => kind !== "past_book" && kind !== "reference_book") }
    });
    await loadCheck();
    render();
  } catch (e) { toast(e.message, "error"); }
}

async function removeSource(driveId) {

const AUDIENCES = ["Adult", "New adult", "Young adult", "Middle grade", "Children"];
const INTIMACY = ["None", "Romantic tension only", "Fade to black", "Open door", "Explicit", "Very explicit"];

function orderedSeriesBooks() {
  const books = (S.sources || []).filter((source) => (source.kinds || []).includes("past_book"));
  const byId = new Map(books.map((book) => [book.driveId, book]));
  const order = [...(S.seriesOrder || []), ...books.map((book) => book.driveId)];
  return [...new Set(order)].map((id) => byId.get(id)).filter(Boolean);
}

function seriesOrderSection() {
  if (S.shape !== "series") return "";
  const books = orderedSeriesBooks();
  if (!books.length) return `<div class="info" style="margin-top:18px">

    <div><b>No earlier series books selected</b><p>Go back to Analyse &amp; group and mark the books whose canon this book inherits as <b>Series book</b>. A current draft or voice sample should remain a Voice reference instead.</p></div></div>`;

  return `<div class="card" style="margin-top:18px">
    <h2 style="margin-top:0">Order the series books</h2>
    <p class="sub">Put the books in continuity order, earliest to latest. Canon Quill uses this order for prior events, character knowledge and unresolved threads. It uses the titles you give the documents, not assumed Book 1, Book 2 or Book 3 numbers.</p>
    <div class="series-order">
      ${books.map((book, index) => `<div class="item" draggable="true"
        ondragstart="seriesDragId='${book.driveId}'"
        ondragover="event.preventDefault()"
        ondrop="dropSeriesBook('${book.driveId}')"

        <span class="drag-handle" title="Drag to reorder">::</span>
        <span class="pill">${index + 1}</span>

        <button class="ghost sm" onclick="event.stopPropagation();moveSeriesBook('${book.driveId}',-1)" ${index === 0 ? "disabled" : ""}>↑</button>
        <button class="ghost sm" onclick="event.stopPropagation();moveSeriesBook('${book.driveId}',1)" ${index === books.length - 1 ? "disabled" : ""}>↓</button>
      </div>`).join("")}
    </div>
    <div class="hint" style="margin-top:10px">If the current book is already started, leave it as a Voice reference and remove its Series book label on the Analyse screen. It should not become prior canon.</div>
  </div>`;
}

async function saveSeriesOrder(order, confirmed = false) {
  try {
    S = await api("/api/project/series-order", { method: "PATCH", body: { order, confirmed } });
    render();
  } catch (e) { toast(e.message, "error"); }
}

function dropSeriesBook(targetId) {
  if (!seriesDragId || seriesDragId === targetId) return;
  const order = orderedSeriesBooks().map((book) => book.driveId);
  const from = order.indexOf(seriesDragId);
  const to = order.indexOf(targetId);
  if (from < 0 || to < 0) return;
  order.splice(from, 1);
  order.splice(to, 0, seriesDragId);
  seriesDragId = null;
  void saveSeriesOrder(order);
}

function moveSeriesBook(id, direction) {
  const order = orderedSeriesBooks().map((book) => book.driveId);
  const from = order.indexOf(id);
  const to = from + direction;
  if (from < 0 || to < 0 || to >= order.length) return;
  [order[from], order[to]] = [order[to], order[from]];
  void saveSeriesOrder(order);
}

async function loadSuggestions() {
  try {
    const r = await api("/api/intake/suggestions");
    const suggestions = r.suggestions || {};
    const current = S.intake || {};
    const automatic = Object.entries(suggestions)
      .filter(([key, suggestion]) => !current[key] && (suggestion.confidence || 0) >= autoApplyThreshold(key))
      .reduce((values, [key, suggestion]) => ({ ...values, [key]: normalizeSuggestion(key, suggestion.value) }), {});
    if (Object.keys(automatic).length > 0) {
      S = await api("/api/project", {
        method: "PATCH",
        body: { intake: automatic, ...(automatic.shape ? { shape: automatic.shape } : {}) }
      });
    }
    if (route === "intake") render();
  } catch { /* Prefills do not block the project-shape screen. */ }
}

function autoApplyThreshold(key) {
  if (key === "audience" || key === "spice") return 0.25;
  return key === "pov" || key === "tense" ? 0.5 : 0.8;
}

function normalizeSuggestion(key, value) {
  if (key === "audience") {
    return [...new Set(String(value).split("|").map((item) => AUDIENCES.find((option) => option.toLowerCase() === item.trim().toLowerCase()) || item.trim()).filter(Boolean))].join("|");
  }
  if (key === "spice") return INTIMACY.find((option) => option.toLowerCase() === String(value).trim().toLowerCase()) || value;
  return value;
}

/** Multi-value fields are stored pipe-joined so the state stays flat strings. */
async function toggleMulti(field, value) {
  const current = ((S.intake || {})[field] || "").split("|").filter(Boolean);
  const next = current.includes(value) ? current.filter((v) => v !== value) : [...current, value];
  await setProject({ intake: { [field]: next.join("|") } });
}
